<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#24262a;--bg:#efeee8;--card:#fff;--line:#d8d5ca;--y:#f2b705;--bad:#c0362c;--ok:#23764a;--mut:#6b6d72;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ecebe6;--bg:#1b1d20;--card:#26292d;--line:#3a3e44;--mut:#9a9da3;--bad:#ff6b5e}}
:root[data-theme="dark"]{--ink:#ecebe6;--bg:#1b1d20;--card:#26292d;--line:#3a3e44;--mut:#9a9da3;--bad:#ff6b5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Vazirmatn,Tahoma,sans-serif}
header{background:#202225;color:#fff;padding:10px 14px 12px}
.br{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.br b{font:800 1.5rem Vazirmatn,sans-serif;letter-spacing:.5px;direction:ltr}.br span{color:var(--y);font-size:.8rem}
header input{background:#34373c;border-color:#4a4e55;color:#fff}
.stripe{height:9px;background:repeating-linear-gradient(135deg,#f2b705 0 14px,#202225 14px 28px)}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:none;border:0;border-bottom:4px solid transparent;background:none;color:var(--ink);font:inherit;padding:10px 14px;min-height:46px}

main{max-width:960px;margin:0 auto;padding:14px}
h2,h3{margin:.2em 0 .5em}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.card.low{border-right:6px solid var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.grid .card{margin:0}.grid b{font-size:1.4rem;display:block}
small,.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.btn{min-height:46px;padding:0 16px;border:0;border-radius:6px;background:var(--y);color:#1a1a1a;font:inherit;font-weight:800;cursor:pointer}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.d{background:var(--bad);color:#fff}
input,select,textarea{width:100%;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr.vd{opacity:.5;text-decoration:line-through}a{color:var(--bad);cursor:pointer}
.tg{direction:ltr;background:var(--bg);padding:0 8px;border-radius:4px;font-size:.85rem;flex:none}
#m{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
#m .box{background:var(--card);border-radius:10px;padding:16px;width:min(560px,100%);max-height:92vh;overflow:auto}
#t{position:fixed;bottom:16px;inset-inline:16px;background:#202225;color:#fff;padding:12px;border-radius:8px;display:none;z-index:30;text-align:center;border:2px solid var(--y)}
#t.on{display:block}#t.bad{border-color:var(--bad)}
.po{display:none}@media print{header,nav,.np,.stripe{display:none}.po{display:block}}
</style></head><body>
<header><div class="br"><b>Road Fuel</b><span>مکمل Road Stake</span></div>
<input id="q" placeholder="جست‌وجو: سریال، ماشین، کد، پلاک، راننده، پروژه" oninput="q=this.value;if(view!='cards')view='cards';render()"></header>
<div class="stripe"></div><nav id="nav"></nav><main id="main"></main><div id="m" onclick="if(event.target==this)modal()"></div><div id="t"></div>
<script>
const K='roadfuel_v2',$=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const N=v=>+D(v).replace(/٫/g,'.').replace(/[,٬]/g,'');
const fn=x=>(+x).toLocaleString('fa-IR'),fd=s=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{dateStyle:'short',timeStyle:'short'}).format(new Date(s));
const nowL=(h=0)=>{const d=new Date(Date.now()-h*36e5);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const mk=w=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit'}).formatToParts(new Date(w)).map(x=>[x.type,x.value]));return p.year+'/'+p.month};
const rl=x=>fn(x)+' ریال';
const TY={alloc:'تخصیص سهمیه',charge:'شارژ ماهانه مرکز',fuel:'سوخت‌گیری',settle:'پایان ماه'},TYPES=['بیل مکانیکی','لودر','بلدوزر','گریدر','کامیون','کمپرسی','غلطک','سایر'];
const ROLES=['راننده','اپراتور ماشین‌آلات','مسئول سوخت','مسئول کارگاه','مدیر'];
const LB={serial:'سریال',code:'کد',name:'نام',type:'نوع',plate:'پلاک',driver:'راننده',project:'پروژه',cap:'سقف سوخت‌گیری',note:'توضیحات'};
let S=null,view='dash',arg=null,q='',persist=true,F={},lastRep=null,tt;
let R={t:'fuel',from:nowL(720).slice(0,10),to:nowL().slice(0,10),m:''};
try{S=JSON.parse(localStorage.getItem(K))}catch(e){persist=false}
function commit(T){try{localStorage.setItem(K,JSON.stringify(T))}catch(e){persist=false}S=T}
function toast(m,b){const e=$('#t');e.textContent=m;e.className=b?'bad on':'on';clearTimeout(tt);tt=setTimeout(()=>e.className='',3800)}
function modal(h){$('#m').innerHTML=h?'<div class="box">'+h+'</div>':'';$('#m').style.display=h?'flex':'none'}
function bal(T,id){const c=T.cards.find(x=>x.id==id);let s=+c.sys0,k=+c.card0;for(const t of T.tx){if(t.card!=id||t.void)continue;if(t.type=='alloc'||t.type=='charge')s+=t.liters;if(t.type=='settle'&&t.mode=='burn')s-=t.liters;if(t.type=='fuel'){s-=t.tr;k+=t.tr-t.liters}}return{s,k}}
function addTx(o){const T=clone(S),c=T.cards.find(x=>x.id==o.card);
 if(!c)return'کارت انتخاب نشده است';
 if(!(o.liters>0)&&!(o.type=='settle'&&o.mode=='carry'))return'مقدار لیتر باید بیشتر از صفر باشد';
 if(!c.active)return'این کارت غیرفعال است';
 if(o.type=='settle'&&T.settings.role!='admin')return'فقط مدیر مجاز به تعیین تکلیف پایان ماه است';
 const b=bal(T,c.id);
 if(o.type=='fuel'){if(o.payer=='person'?!o.payPerson:!o.src)return'پرداخت‌کننده را مشخص کنید';o.price=T.settings.price||0;o.amount=Math.round(o.liters*o.price);if(o.payer=='person')o.settled=null;if(o.liters>b.k)return'مقدار سوخت‌گیری از سهمیه قابل تحویل ('+fn(b.k)+' لیتر) بیشتر است';if(c.cap>0&&o.liters>c.cap)return'مقدار از سقف سوخت‌گیری این خودرو ('+fn(c.cap)+' لیتر) بیشتر است';o.tr=Math.min(o.liters,b.s)}
 if(o.type=='settle'){if(o.mode=='carry')o.liters=b.s;else if(o.liters>b.s)return'مقدار بیشتر از سهمیه مانده در مرکز است'}
 const t={id:'T'+T.seq++,at:new Date().toISOString(),by:T.settings.user,void:null,bs:b.s,bk:b.k,...o};
 T.tx.push(t);const a=bal(T,c.id);t.as=a.s;t.ak=a.k;commit(T);return null}
function voidTx(id,r){if(!r.trim())return'علت ابطال الزامی است';const T=clone(S),t=T.tx.find(x=>x.id==id);
 if(!t||t.void)return'عملیات پیدا نشد یا قبلاً باطل شده است';
 t.void={reason:r.trim(),by:T.settings.user,at:new Date().toISOString()};
 for(const c of T.cards){const b=bal(T,c.id);if(b.s<0||b.k<0)return'ابطال این عملیات باعث منفی شدن موجودی می‌شود'}
 commit(T);return null}
function saveCard(id,v){const T=clone(S),sr=v.serial.trim();
 if(!sr||!v.name.trim())return'شماره سریال و نام ماشین‌آلات الزامی است';
 if(T.cards.some(c=>c.serial==sr&&c.id!=id))return'کارتی با این شماره سریال قبلاً ثبت شده است';
 v.serial=sr;
 if(id){const c=T.cards.find(x=>x.id==id),ch=[];for(const k in LB)if((c[k]||'')!=v[k])ch.push(LB[k]+': «'+(c[k]||'')+'» به «'+v[k]+'»');
  if(!ch.length)return'تغییری وجود ندارد';Object.assign(c,v);T.edits.push({card:id,at:new Date().toISOString(),by:T.settings.user,changes:ch.join('، ')})}
 else{if(v.sys0<0||v.card0<0)return'مقادیر اولیه نمی‌تواند منفی باشد';T.cards.push({id:'C'+T.seq++,active:true,date:new Date().toISOString(),...v})}
 commit(T);return null}
function seed(){S={cards:[],persons:[],tx:[],edits:[],seq:10,settings:{user:'مدیر سیستم',role:'admin',low:100,price:30000,prices:[],sources:[{name:'بودجه پروژه',active:true},{name:'دفتر مرکزی',active:true},{name:'پیمانکار',active:true}]}};
 [['علی رضایی','راننده'],['حسن کریمی','مسئول سوخت'],['محمد احمدی','اپراتور ماشین‌آلات'],['مهدی نوری','مدیر']].forEach((p,i)=>S.persons.push({id:'P'+(i+1),name:p[0],role:p[1],code:'10'+(i+1),phone:'',active:true,note:''}));
 [['GC-100245','بیل مکانیکی کوماتسو','EX-01','بیل مکانیکی','','علی رضایی','کارگاه محور شمالی',5000,200,300],['GC-100311','لودر کاترپیلار','LD-02','لودر','','محمد احمدی','کارگاه محور شمالی',3000,60,200],['GC-100478','کمپرسی ولوو','TR-07','کمپرسی','۱۲ ع ۳۴۵ ایران ۱۰','حسن کریمی','پروژه باند دوم',2000,200,180]]
 .forEach((c,i)=>S.cards.push({id:'C'+(i+1),serial:c[0],name:c[1],code:c[2],type:c[3],plate:c[4],driver:c[5],project:c[6],sys0:c[7],card0:c[8],cap:c[9],note:'',active:true,date:new Date().toISOString()}));
 addTx({type:'charge',card:'C1',liters:1000,when:nowL(72),receipt:'R-501',note:'شارژ ماهانه'});
 addTx({type:'fuel',payer:'company',src:'بودجه پروژه',card:'C1',liters:150,when:nowL(48),person:'علی رضایی',driver:'',receipt:'',note:''});
 addTx({type:'charge',card:'C3',liters:300,when:nowL(30),receipt:'R-502',note:''});
 addTx({type:'fuel',payer:'person',payPerson:'حسن کریمی',card:'C3',liters:120,when:nowL(5),person:'حسن کریمی',driver:'',receipt:'',note:''})}
if(!S||!S.cards)seed();
S.settings.sources=S.settings.sources||[{name:'بودجه پروژه',active:true},{name:'دفتر مرکزی',active:true},{name:'پیمانکار',active:true}];S.settings.prices=S.settings.prices||[];if(S.settings.price==null)S.settings.price=30000;
const opts=(a,sel,f)=>a.map(x=>{const v=x.id??x;return`<option value="${esc(v)}"${v==sel?' selected':''}>${esc(f?f(x):x)}</option>`}).join('');
const match=c=>!q||D([c.serial,c.name,c.code,c.plate,c.driver,c.project].join(' ')).includes(D(q));
const st=(l,v)=>`<div class="card"><small>${l}</small><b>${v}</b></div>`;
const tile=c=>{const b=bal(S,c.id),lo=c.active&&b.s+b.k<=S.settings.low;return`<div class="card${lo?' low':''}" onclick="go('det','${c.id}')" style="cursor:pointer"><div class="row" style="justify-content:space-between"><b>${esc(c.name)}</b><span class="tg">${esc(c.serial)}</span></div><small>${esc(c.code)}، ${esc(c.driver)}، ${esc(c.project)}${c.active?'':'، غیرفعال'}</small><div class="row" style="margin-top:6px"><div><small>سهمیه مرکز</small><br><b>${fn(b.s)}</b> ل</div><div><small>سهمیه قابل تحویل</small><br><b class="${lo?'bad':''}">${fn(b.k)}</b> ل</div></div></div>`};
const txT=l=>`<div class="sc"><table><tr><th>زمان<th>نوع<th>کارت<th>لیتر<th>مبلغ (ریال)<th>پرداخت‌کننده<th>شخص<th>ثبت‌کننده<th>قابل تحویل بعد<th></tr>${l.map(t=>{const c=S.cards.find(x=>x.id==t.card)||{},py=t.type!='fuel'?'':t.payer=='person'?'شخص: '+esc(t.payPerson)+(t.settled?' (تسویه‌شده)':' (تسویه‌نشده)'):esc(t.src);return`<tr class="${t.void?'vd':''}"><td>${fd(t.when)}<td>${TY[t.type]}<td dir="ltr">${esc(c.serial)}<td>${fn(t.liters)}<td>${t.type=='fuel'?fn(t.amount||0):''}<td>${py}<td>${esc(t.person)}<td>${esc(t.by)}<td>${fn(t.ak)}<td>${t.void?'باطل: '+esc(t.void.reason):`<a onclick="voidForm('${t.id}')">ابطال</a>${t.payer=='person'&&!t.settled?` <a style="color:var(--ok)" onclick="payForm('${t.id}')">تسویه</a>`:''}${t.payer=='person'&&t.settled?` <a style="color:var(--ok)" onclick="stForm('${t.id}')">اصلاح تسویه</a>`:''}`}`}).join('')}</table></div>`;
const NAV=[['dash','داشبورد'],['cards','کارت‌های گازوئیل'],['mach','ماشین‌آلات'],['fuel','ثبت سوخت‌گیری'],['charge','شارژ ماهانه'],['pers','اشخاص'],['stm','صورتحساب اشخاص'],['stmt','صورتحساب اشخاص'],['rep','گزارش‌ها'],['set','تنظیمات']];
function go(v,a){view=v;arg=a||null;render();scrollTo(0,0)}
function render(){$('#nav').innerHTML=NAV.map(([k,l])=>`<button class="${view==k||(view=='det'&&k=='cards')?'on':''}" onclick="go('${k}')">${l}</button>`).join('');$('#main').innerHTML=V[view]();if($('#fc'))info()}
function info(){const c=S.cards.find(x=>x.id==$('#fc').value),b=c&&bal(S,c.id),L=N($('#fl').value),p=S.settings.price;$('#inf').innerHTML=c?`<div class="card">سریال: <b dir="ltr">${esc(c.serial)}</b>، ${esc(c.name)}<br>سهمیه مرکز: <b>${fn(b.s)}</b> ل، قابل تحویل: <b>${fn(b.k)}</b> ل${c.cap?'، سقف: <b>'+fn(c.cap)+'</b> ل':''}${L>0?`<br>${$('#py')?'مبلغ':'ارزش سهمیه'}: <b>${rl(Math.round(L*p))}</b> (قیمت هر لیتر ${rl(p)})`:''}</div>`:'';$('#fj').textContent=fd($('#fw').value||nowL())}
const srcSel=()=>`<label>منبع پرداخت</label><select id="ps">${opts(S.settings.sources.filter(x=>x.active).map(x=>x.name),'')}</select>`;
function pyc(){$('#pyc').innerHTML=$('#py').value=='person'?`<label>شخص پرداخت‌کننده</label><select id="pp">${pOpts()}</select>`:srcSel()}
const pOpts=()=>'<option value="">انتخاب کنید…</option>'+opts(S.persons.filter(p=>p.active).map(p=>p.name),'');
function ff(ty){const f=ty=='fuel',cs=S.cards.filter(c=>c.active);return`<div class="card"><h2>${f?'ثبت سوخت‌گیری':'شارژ ماهانه سهمیه مرکز'}</h2><label>کارت گازوئیل</label><select id="fc" onchange="info()"><option value="">انتخاب کنید…</option>${opts(cs,arg,c=>c.serial+'، '+c.name)}</select><div id="inf"></div>
${f?`<label>نام سوخت‌گیرنده</label><select id="fp">${pOpts()}</select><label>راننده یا اپراتور (در صورت تفاوت)</label><input id="fd2"><label>پرداخت‌کننده هزینه</label><select id="py" onchange="pyc()"><option value="company">شرکت</option><option value="person">شخص</option></select><div id="pyc">${srcSel()}</div>`:''}
<label>مقدار (لیتر)</label><input id="fl" inputmode="decimal" oninput="info()"><label>تاریخ و ساعت (پیش‌فرض: اکنون)</label><input id="fw" type="datetime-local" value="${nowL()}" onchange="info()"><small id="fj"></small>
${f?'<label>محل سوخت‌گیری یا جایگاه</label><input id="fx">':''}<label>شماره رسید یا کد پیگیری</label><input id="fr"><label>توضیحات</label><textarea id="fnote" rows="2"></textarea><br><br><button class="btn" style="width:100%" onclick="subTx('${ty}')">ثبت</button></div>`}
function subTx(ty,force){const f=ty=='fuel',o={type:ty,card:$('#fc').value,liters:N($('#fl').value),when:$('#fw').value||nowL(),receipt:$('#fr').value,note:$('#fnote').value};
 if(f){o.person=$('#fp').value;o.driver=$('#fd2').value;o.place=$('#fx').value;o.payer=$('#py').value;if(o.payer=='person')o.payPerson=$('#pp').value;else o.src=$('#ps').value;if(!o.person)return toast('سوخت‌گیرنده را انتخاب کنید',1)}
 if(!force){const w=[],m=f?0:S.tx.filter(t=>t.type=='charge'&&!t.void&&t.card==o.card&&mk(t.when)==mk(o.when)).length;if(m>=2)w.push('این شارژ شمارهٔ '+fn(m+1)+' این کارت در همین ماه است');if(o.receipt&&S.tx.some(t=>!t.void&&t.receipt==o.receipt))w.push('این شماره رسید قبلاً ثبت شده است');if(w.length)return modal('<h3>مطمئن هستید؟</h3><p>'+w.join('<br>')+'</p><button class="btn" onclick="modal();subTx(\''+ty+'\',1)">بله، ثبت شود</button> <button class="btn g" onclick="modal()">انصراف</button>')}
 const e=addTx(o);if(e)return toast(e,1);const b=bal(S,o.card);toast('ثبت شد. سهمیه مرکز: '+fn(b.s)+'، قابل تحویل: '+fn(b.k)+' لیتر');go('det',o.card)}
function payForm(id){modal(`<h3>تسویه پرداخت شخصی</h3><label>تاریخ و ساعت تسویه</label><input id="yw" type="datetime-local" value="${nowL()}"><label>توضیح (مثلاً شماره پرداخت)</label><textarea id="yn" rows="2"></textarea><br><br><button class="btn" onclick="doPay('${id}')">ثبت تسویه</button> <button class="btn g" onclick="modal()">انصراف</button>`)}
function doPay(id){const T=clone(S),t=T.tx.find(x=>x.id==id);if(!t||t.void||t.payer!='person'||t.settled)return toast('این عملیات قابل تسویه نیست',1);t.settled={when:$('#yw').value||nowL(),at:new Date().toISOString(),by:T.settings.user,note:$('#yn').value};commit(T);modal();toast('تسویه ثبت شد');render()}

<div class="card"><div class="sc"><table><tr><th class="np"><th>تاریخ<th>سریال<th>ماشین<th>لیتر<th>مبلغ (ریال)<th>رسید<th>وضعیت</tr>${l.map(t=>{const c=S.cards.find(x=>x.id==t.card)||{};return`<tr><td class="np">${t.settled?'':`<input type="checkbox" class="ck" value="${t.id}" style="width:20px;min-height:20px">`}<td>${fd(t.when)}<td dir="ltr">${esc(c.serial)}<td>${esc(c.name)}<td>${fn(t.liters)}<td>${fn(t.amount||0)}<td>${esc(t.receipt)}<td>${t.settled?'تسویه‌شده '+fd(t.settled.when)+(t.settled.note?'، '+esc(t.settled.note):'')+` <a class="np" style="color:var(--ink)" onclick="stForm('${t.id}')">اصلاح</a>`:'تسویه‌نشده'}`}).join('')}</table></div>${l.length?'':'<p>موردی در این بازه نیست.</p>'}<div class="row np"><button class="btn" onclick="payManyForm()">تسویهٔ موارد انتخاب‌شده</button><button class="btn g" onclick="selUn()">انتخاب همهٔ تسویه‌نشده‌ها</button><button class="btn g" onclick="print()">چاپ</button></div></div>`},
rep(){const d=repData();lastRep=d;return`<div class="card"><label>نوع گزارش</label><select onchange="R.t=this.value;render()">${RT.map(([k,l])=>`<option value="${k}"${R.t==k?' selected':''}>${l}</option>`).join('')}</select><div class="row"><div><label>از تاریخ</label><input type="date" value="${R.from}" onchange="R.from=this.value;render()"></div><div><label>تا تاریخ</label><input type="date" value="${R.to}" onchange="R.to=this.value;render()"></div></div>${R.t=='fuel'||R.t=='mach'?`<label>ماشین</label><select onchange="R.m=this.value;render()"><option value="">همه</option>${opts(S.cards,R.m,c=>c.name+'، '+c.serial)}</select>`:''}</div>
<div class="card"><div class="sc"><table><tr>${d.h.map(x=>'<th>'+x).join('')}</tr>${d.r.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)).join('')+'</tr>').join('')}</table></div>${d.r.length?'':'<p>داده‌ای در این بازه نیست.</p>'}${d.tot!=null?`<p><b>جمع: ${fn(d.tot)} لیتر${d.totR!=null?'، '+rl(d.totR):''}</b></p>`:''}<div class="row np"><button class="btn g" onclick="copyRep()">کپی برای Excel</button><button class="btn g" onclick="print()">چاپ یا PDF</button></div></div>`},
set(){const s=S.settings;return`<div class="card"><h3>کاربر و دسترسی</h3><label>نام کاربر ثبت‌کننده</label><input id="su" value="${esc(s.user)}"><label>سطح دسترسی</label><select id="sr"><option value="admin"${s.role=='admin'?' selected':''}>مدیر (تعیین تکلیف پایان ماه مجاز)</option><option value="fuel"${s.role=='fuel'?' selected':''}>مسئول سوخت</option></select><label>آستانه هشدار موجودی کم (لیتر)</label><input id="sl" inputmode="decimal" value="${s.low}"><label>قیمت هر لیتر گازوئیل (ریال)</label><input id="spr" inputmode="decimal" value="${s.price}"><br><br><button class="btn" onclick="saveSet()">ذخیره</button><p class="mut">دسترسی‌ها فقط یک کلید محلی روی همین دستگاه هستند و احراز هویت واقعی نیستند.</p></div>
<div class="card"><h3>منابع پرداخت شرکت</h3>${s.sources.map((x,i)=>`<p>${esc(x.name)}، <a style="color:var(--ink)" onclick="togSrc(${i})">${x.active?'فعال':'غیرفعال'}</a></p>`).join('')}<div class="row"><input id="sn2" placeholder="منبع جدید"><button class="btn g" onclick="addSrc()">افزودن</button></div></div><div class="card"><h3>تاریخچه قیمت</h3>${s.prices.length?s.prices.map(p=>`<p>${fd(p.at)}، ${esc(p.by)}: ${fn(p.from)} به ${fn(p.to)} ریال</p>`).join(''):'<p class="mut">تغییری ثبت نشده است. قیمت هر سوخت‌گیری در لحظهٔ ثبت روی همان عملیات می‌ماند.</p>'}</div><div class="card"><h3>ذخیره‌سازی و پشتیبان</h3><p>${persist?'داده‌ها در حافظه مرورگر همین دستگاه (localStorage) ذخیره می‌شوند و پس از بستن و بازکردن برنامه می‌مانند.':'<b class="bad">ذخیره‌سازی مرورگر در دسترس نیست؛ داده‌ها فقط تا بستن صفحه می‌مانند.</b>'} پاک‌کردن اطلاعات مرورگر، داده‌ها را حذف می‌کند؛ پس مرتب پشتیبان بگیرید.</p><textarea id="bk" rows="4" placeholder="متن پشتیبان اینجا نمایش داده یا برای بازیابی جای‌گذاری می‌شود"></textarea><div class="row"><button class="btn g" onclick="bkOut()">تهیه پشتیبان</button><button class="btn g" onclick="bkIn()">بازیابی از متن</button><button class="btn d" onclick="modal('<h3>بازگشت به داده نمونه</h3><p>همه اطلاعات فعلی پاک می‌شود.</p><button class=\\'btn d\\' onclick=\\'seed();modal();go(&quot;dash&quot;)\\'>پاک‌کردن و بارگذاری نمونه</button> <button class=\\'btn g\\' onclick=\\'modal()\\'>انصراف</button>')">داده نمونه</button></div></div>`}};
let B={p:'',from:'',to:''};
const payers=()=>[...new Set([...S.persons.map(p=>p.name),...S.tx.filter(t=>t.payer=='person').map(t=>t.payPerson)])];
const stmRows=()=>S.tx.filter(t=>t.type=='fuel'&&!t.void&&t.payer=='person'&&t.payPerson==B.p&&(!B.from||t.when.slice(0,10)>=B.from)&&(!B.to||t.when.slice(0,10)<=B.to)).sort((a,b)=>a.when.localeCompare(b.when));
function payMany(all){const ids=all?stmRows().filter(t=>!t.settled).map(t=>t.id):[...document.querySelectorAll('.ck:checked')].map(x=>x.value);if(!ids.length)return toast('موردی برای تسویه انتخاب نشده است',1);
 const l=ids.map(i=>S.tx.find(t=>t.id==i));modal(`<h3>تسویهٔ گروهی</h3><p>${fn(l.length)} سوخت‌گیری، جمع: <b>${rl(l.reduce((a,t)=>a+(t.amount||0),0))}</b></p><label>تاریخ و ساعت تسویه</label><input id="yw" type="datetime-local" value="${nowL()}"><label>توضیح (مثلاً شماره پرداخت)</label><textarea id="yn" rows="2"></textarea><br><br><button class="btn" onclick="doPayMany('${ids.join(',')}')">ثبت تسویه</button> <button class="btn g" onclick="modal()">انصراف</button>`)}
function doPayMany(csv){const T=clone(S),bt='B'+T.seq++,w=$('#yw').value||nowL(),n=$('#yn').value;for(const i of csv.split(',')){const t=T.tx.find(x=>x.id==i);if(!t||t.void||t.payer!='person'||t.settled)return toast('یکی از موارد قابل تسویه نیست؛ هیچ تغییری ثبت نشد',1);t.settled={when:w,at:new Date().toISOString(),by:T.settings.user,note:n,batch:bt}}commit(T);modal();toast('تسویه ثبت شد');render()}
V.stm=()=>{const l=stmRows(),am=x=>x.reduce((a,t)=>a+(t.amount||0),0),us=l.filter(t=>!t.settled),C=id=>S.cards.find(x=>x.id==id)||{};
 const sel=`<div class="card np"><label>شخص</label><select onchange="B.p=this.value;render()"><option value="">انتخاب کنید…</option>${opts(payers(),B.p)}</select><div class="row"><div><label>از تاریخ</label><input type="date" value="${B.from}" onchange="B.from=this.value;render()"></div><div><label>تا تاریخ</label><input type="date" value="${B.to}" onchange="B.to=this.value;render()"></div></div></div>`;
 if(!B.p)return sel+'<p>یک شخص را انتخاب کنید تا صورتحساب پرداخت‌های او نمایش داده شود.</p>';
 return sel+`<div class="po"><h2>صورتحساب پرداخت‌های شخصی: ${esc(B.p)}</h2><p>تاریخ صدور: ${fd(new Date())}${B.from||B.to?'، بازه: '+(B.from||'…')+' تا '+(B.to||'…'):''}</p></div><div class="grid">${st('کل پرداخت‌شده توسط او',rl(am(l)))}${st('تسویه‌شده',rl(am(l.filter(t=>t.settled))))}${st('مانده بدهی شرکت',rl(am(us)))}</div><div class="card"><div class="sc"><table><tr><th class="np"><th>تاریخ<th>ماشین<th>سریال<th>لیتر<th>مبلغ (ریال)<th>رسید<th>وضعیت</tr>${l.map(t=>`<tr><td class="np">${t.settled?'':`<input type="checkbox" class="ck" value="${t.id}" style="width:auto;min-height:0">`}<td>${fd(t.when)}<td>${esc(C(t.card).name)}<td dir="ltr">${esc(C(t.card).serial)}<td>${fn(t.liters)}<td>${fn(t.amount||0)}<td>${esc(t.receipt)}<td>${t.settled?'تسویه‌شده '+fd(t.settled.when)+(t.settled.note?'، '+esc(t.settled.note):''):'تسویه‌نشده'}`).join('')}</table></div>${l.length?'':'<p>پرداخت شخصی در این بازه ثبت نشده است.</p>'}<p><b>مانده بدهی: ${rl(am(us))}</b></p><div class="row np"><button class="btn" onclick="payMany(0)">تسویهٔ موارد انتخاب‌شده</button><button class="btn" onclick="payMany(1)">تسویهٔ همه</button><button class="btn g" onclick="print()">چاپ صورتحساب</button></div></div>`};
function stForm(id){const t=S.tx.find(x=>x.id==id),n=S.tx.filter(x=>!x.void&&x.settled&&t.settled.batch&&x.settled.batch==t.settled.batch).length;
 modal(`<h3>اصلاح تسویه</h3><label>تاریخ و ساعت تسویه</label><input id="ew" type="datetime-local" value="${esc(t.settled.when)}"><label>توضیح تسویه</label><textarea id="en" rows="2">${esc(t.settled.note)}</textarea>${n>1?`<label>دامنهٔ اصلاح</label><select id="es"><option value="one">فقط این مورد</option><option value="all">کل تسویهٔ گروهی (${fn(n)} مورد)</option></select>`:''}<label>علت اصلاح (الزامی)</label><textarea id="er" rows="2"></textarea><p class="mut">وضعیت قبلی در تاریخچه می‌ماند و در گزارش مغایرت دیده می‌شود.</p><button class="btn" onclick="doSt('${id}','edit')">ذخیره اصلاح</button> <button class="btn d" onclick="doSt('${id}','undo')">لغو تسویه</button> <button class="btn g" onclick="modal()">انصراف</button>`)}
function doSt(id,mode){const r=$('#er').value.trim();if(!r)return toast('علت اصلاح الزامی است',1);const T=clone(S),t0=T.tx.find(x=>x.id==id);if(!t0||t0.void||!t0.settled)return toast('این مورد تسویه‌شده نیست',1);
 const sc=$('#es')?$('#es').value:'one',bt=t0.settled.batch,l=T.tx.filter(x=>!x.void&&x.settled&&(sc=='all'&&bt?x.settled.batch==bt:x.id==id));
 for(const t of l){(t.payLog=t.payLog||[]).push({...t.settled,action:mode=='undo'?'لغو تسویه':'اصلاح تسویه',reason:r,actAt:new Date().toISOString(),actBy:T.settings.user});if(mode=='undo')t.settled=null;else t.settled={...t.settled,when:$('#ew').value||t.settled.when,note:$('#en').value}}
 commit(T);modal();toast(mode=='undo'?'تسویه لغو شد؛ مبلغ دوباره بدهی است':'اصلاح ثبت شد');render()}
render();
</script></body></html>
