:root{--bg:#eef1f4;--card:#fff;--ink:#0d1620;--muted:#55616d;--line:#cfd6dd;--primary:#0a5c8a;--primary-ink:#fff;--primary-soft:#dcecf6;--staff:#ffd400;--staff-ink:#1a1500;--axis-soft:#eceff1;--err:#c62828;--err-soft:#fdeaea;--warn:#8a5200;--warn-soft:#fff1d6;--ok:#1b7a3d;--ok-soft:#e1f4e6;--top-h:52px;--y:var(--staff);--bad:var(--err);--mut:var(--muted);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1318;--card:#171f27;--ink:#edf2f6;--muted:#9aa8b5;--line:#2c3946;--primary:#4aa8dc;--primary-ink:#04202f;--primary-soft:#14313f;--axis-soft:#1d262e;--err:#ff8a80;--err-soft:#3a1c1c;--warn:#ffc266;--warn-soft:#382a10;--ok:#6fcf76;--ok-soft:#16301a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Vazirmatn","Vazir","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;padding-top:calc(var(--top-h) + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0 0 .5rem;line-height:1.35}h2{font-size:1.1rem}h3{font-size:1rem}p{margin:.25rem 0 .6rem}
small,.mut{color:var(--muted)}.bad{color:var(--err)}.ok{color:var(--ok)}
#top{position:fixed;inset:0 0 auto 0;z-index:30;height:calc(var(--top-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px;background:var(--primary);color:var(--primary-ink)}
#top .title{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .title small{display:block;font-weight:400;opacity:.85;font-size:.72rem;line-height:1.1;color:inherit}

<script>
/* ===== Road Care V14.0: فیلتر گزارش وابسته به نوع گزارش (خودرو / شخص / بدون فیلتر)؛ فعال|غیرفعال دکمه‌ای در فرم کارکرد ===== */
(function(){
'use strict';
const KIND={fuel:'veh',mach:'veh',chg:'veh',bal:'veh',xfer:'veh',work:'veh',workday:'veh',workop:'veh',mcost:'veh',mfph:'veh',
 per:'per',dbt:'per',attend:'per',attendday:'per',
 tled:'none',tms:'none',cost:'none',bnk:'none',dis:'none'};
const kindOf=t=>KIND[t]||'none';
const hitVeh=t=>(t.card&&('c:'+t.card)===R.m)||t.recv===R.m||t.mref===R.m;
const _rd=window.repData;
window.repData=function(){
 const k=kindOf(R.t),save=S;
 if(k==='veh'&&R.m){
  S={...save,tx:save.tx.filter(hitVeh),work:(save.work||[]).filter(w=>w.ref===R.m),svc:(save.svc||[]).filter(x=>x.ref===R.m),faults:(save.faults||[]).filter(x=>x.ref===R.m),reads:(save.reads||[]).filter(x=>x.ref===R.m),checks:(save.checks||[]).filter(x=>x.ref===R.m),plans:(save.plans||[]).filter(x=>x.ref===R.m),deletions:[]};
  try{return _rd.apply(this,arguments)}finally{S=save}
 }
 if(k==='per'&&R.p){
  const p=R.p;
  const tx=R.t==='dbt'?save.tx.filter(t=>t.payer==='person'&&t.payPerson===p):save.tx.filter(t=>t.person===p);
  S={...save,tx,attend:(save.attend||[]).filter(a=>a.name===p)};
  try{return _rd.apply(this,arguments)}finally{S=save}
 }
 // بدون فیلتر: فیلترهای قبلی را خنثی می‌کنیم تا همه‌چیز بیاید
 const om=R.m,op=R.p;R.m='';R.p='';
 try{return _rd.apply(this,arguments)}finally{R.m=om;R.p=op}
};
function personsList(){return S.persons.map(p=>p.name).filter((v,i,a)=>v&&a.indexOf(v)===i)}
function buildFilter(){
 const main=document.getElementById('main');if(!main)return;
 const old=document.getElementById('vf');if(old)old.remove();
 const k=kindOf(R.t);if(k==='none')return;
 const card=document.createElement('div');card.className='card';card.id='vf';
 if(k==='veh'){
  card.innerHTML='<label>فیلتر خودرو</label><select id="vf_s"><option value="">همه خودروها</option>'+[...S.cards.filter(c=>!c.archived).map(c=>['c:'+c.id,c.name+' ('+(c.code||c.serial)+')']),...S.machines.filter(m=>m.active!==false).map(m=>['m:'+m.id,m.name+' ('+(m.code||'')+')'])].map(([v,l])=>'<option value="'+v+'"'+(v===R.m?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';
  {card.className='rv-filter';main.prepend(card);setTimeout(()=>{const rc=document.querySelector('#main .report-controls');const ts=rc&&rc.querySelector('select');if(ts&&card.isConnected)ts.insertAdjacentElement('afterend',card)},0);}card.querySelector('#vf_s').addEventListener('change',e=>{R.m=e.target.value;R.pg=0;render()});
 }else{
  card.innerHTML='<label>فیلتر شخص</label><select id="vf_s"><option value="">همه اشخاص</option>'+personsList().map(n=>'<option'+(n===R.p?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select>';
  {card.className='rv-filter';main.prepend(card);setTimeout(()=>{const rc=document.querySelector('#main .report-controls');const ts=rc&&rc.querySelector('select');if(ts&&card.isConnected)ts.insertAdjacentElement('afterend',card)},0);}card.querySelector('#vf_s').addEventListener('change',e=>{R.p=e.target.value;R.pg=0;render()});
 }
}
/* فرم کارکرد: تیک غیرفعال -> دو دکمه فعال | غیرفعال */
function buildWorkToggle(){
 if(!R.wsel)return;const cb=document.getElementById('wk2_off');if(!cb)return;
 const lab=cb.closest('label')||cb.parentElement;if(lab)lab.style.display='none';
 let seg=document.getElementById('wk2seg');if(!seg){
  seg=document.createElement('div');seg.id='wk2seg';seg.style.cssText='display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0 4px';
  seg.innerHTML='<button type="button" data-v="0" style="flex:1;min-height:46px;border:0;font:inherit;font-weight:700;cursor:pointer">فعال</button><button type="button" data-v="1" style="flex:1;min-height:46px;border:0;font:inherit;font-weight:700;cursor:pointer">غیرفعال</button>';
  lab.parentNode.insertBefore(seg,lab);
  seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const want=b.dataset.v==='1';if(cb.checked!==want){cb.checked=want;if(window.wkOffT)window.wkOffT()}paint()}));
 }
 function paint(){const off=cb.checked;seg.querySelectorAll('button').forEach(b=>{const on=(b.dataset.v==='1')===off;b.style.background=on?(off?'var(--err)':'var(--ok)'):'var(--card)';b.style.color=on?'#fff':'var(--ink)'})}
 paint();
}
const _render=window.render;

<script>

/* ===== Road Care V18.0: جمع آیتم‌ها به تفکیک در خلاصهٔ گزارش‌ها ===== */
(function(){
'use strict';
const KIND={fuel:'veh',mach:'veh',chg:'veh',bal:'veh',xfer:'veh',work:'veh',workday:'veh',workop:'veh',mcost:'veh',mfph:'veh',
 per:'per',dbt:'per',attend:'per',attendday:'per'};
const inR=d=>String(d).slice(0,10)>=R.from&&String(d).slice(0,10)<=R.to;
const fmt=x=>(Math.round(x*10)/10).toLocaleString('fa-IR');
const nm=n=>(n||'—');
function vehName(ref){const c=S.cards.find(x=>'c:'+x.id===ref),m=S.machines.find(x=>'m:'+x.id===ref);const o=c||m;return o?(o.name+(o.code?' ('+o.code+')':'')):ref}
function vehRows(){
 const byRef={};const get=r=>byRef[r]=byRef[r]||{days:new Set(),hours:0,units:{},fuel:0,ops:0};
 (S.work||[]).filter(w=>!w.superseded&&!w.off&&inR(w.date)&&(!R.m||w.ref===R.m)).forEach(w=>{const g=get(w.ref);g.days.add(w.date);if(w.hours>0)g.hours+=w.hours;
  if(w.volume>0&&w.unit){g.units[w.unit]=(g.units[w.unit]||0)+w.volume}
  if(w.volume2>0&&w.unit2){g.units[w.unit2]=(g.units[w.unit2]||0)+w.volume2}});
 (S.tx||[]).filter(t=>t.type==='fuel'&&!t.void&&inR(t.when)&&(!R.m||(t.recv||('c:'+t.card))===R.m)).forEach(t=>{const g=get(t.recv||('c:'+t.card));g.fuel+=t.liters||0;g.ops+=1});
 const rows=Object.keys(byRef).map(r=>({name:vehName(r),...byRef[r],days:byRef[r].days.size}));
 const tot={days:0,hours:0,fuel:0,units:{}};rows.forEach(x=>{tot.days+=x.days;tot.hours+=x.hours;tot.fuel+=x.fuel;Object.entries(x.units).forEach(([u,v])=>tot.units[u]=(tot.units[u]||0)+v)});
 return{rows,tot};
}
function unitText(u){const e=Object.entries(u);return e.length?e.map(([k,v])=>fmt(v)+' '+k).join('، '):'—'}
function attendRows(){
 const A=(S.attend||[]).filter(a=>!a.superseded&&inR(a.date)&&(!R.p||a.name===R.p));const by={};
 A.forEach(a=>{const g=by[a.name]=by[a.name]||{present:0,absent:0,leave:0,hours:0,ot:0};if(a.state==='present'){g.present++;g.hours+=a.hours||0;g.ot+=a.ot||0}else if(a.state==='absent')g.absent++;else if(a.state==='leave')g.leave++});
 const rows=Object.keys(by).map(n=>({name:n,...by[n]}));const tot={present:0,absent:0,leave:0,hours:0,ot:0};rows.forEach(x=>{['present','absent','leave','hours','ot'].forEach(k=>tot[k]+=x[k])});
 return{rows,tot};
}
function personFuelRows(){
 const by={};(S.tx||[]).filter(t=>t.type==='fuel'&&!t.void&&inR(t.when)&&(!R.p||(R.t==='dbt'?t.payPerson:t.person)===R.p)).forEach(t=>{const k=R.t==='dbt'?(t.payPerson||'—'):(t.person||'—');const g=by[k]=by[k]||{ops:0,liters:0,amount:0};g.ops++;g.liters+=t.liters||0;g.amount+=t.amount||0});
 const rows=Object.keys(by).map(n=>({name:n,...by[n]}));const tot={ops:0,liters:0,amount:0};rows.forEach(x=>{tot.ops+=x.ops;tot.liters+=x.liters;tot.amount+=x.amount});return{rows,tot};
}
function tbl(head,body){return '<div class="sc"><table><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+body+'</table></div>'}
function sumCard(html){return '<div class="card" id="sumcard" style="margin-top:10px"><h3>جمع به تفکیک آیتم‌ها</h3>'+html+'</div>'}
function buildTotals(){
 const old=document.getElementById('sumcard');if(old)old.remove();const oldU=document.getElementById('unitsum');if(oldU)oldU.remove();
 const k=KIND[R.t];if(!k)return;const sheet=document.querySelector('#main .report-sheet');if(!sheet)return;
 let html='';
 if(k==='veh'){
  const {rows,tot}=vehRows();
  if(!rows.length){html='<p class="mut">در این بازه برای این خودرو کارکرد یا سوختی ثبت نشده است.</p>'}
  else{
   const body=rows.map(x=>'<tr><td>'+x.name+'</td><td>'+fmt(x.days)+'</td><td>'+(x.hours?fmt(x.hours):'—')+'</td><td>'+unitText(x.units)+'</td><td>'+(x.fuel?fmt(x.fuel):'—')+'</td></tr>').join('')
    +'<tr style="font-weight:800"><td>جمع کل</td><td>'+fmt(tot.days)+'</td><td>'+(tot.hours?fmt(tot.hours):'—')+'</td><td>'+unitText(tot.units)+'</td><td>'+(tot.fuel?fmt(tot.fuel):'—')+'</td></tr>';
   html=tbl(['آیتم','روز کار','ساعت کارکرد','جمع عملیات (هر واحد جدا)','سوخت (ل)'],body)
    +'<p class="mut" style="font-size:12px;margin-top:6px">واحدهای مختلف با هم جمع نمی‌شوند.</p>';
  }
 } else if(R.t==='attend'||R.t==='attendday'){
  const {rows,tot}=attendRows();
  if(!rows.length)html='<p class="mut">در این بازه حضور و غیابی ثبت نشده است.</p>';
  else{const body=rows.map(x=>'<tr><td>'+x.name+'</td><td>'+fmt(x.present)+'</td><td>'+fmt(x.absent)+'</td><td>'+fmt(x.leave)+'</td><td>'+(x.hours?fmt(x.hours):'—')+'</td><td>'+(x.ot?fmt(x.ot):'—')+'</td></tr>').join('')
   +'<tr style="font-weight:800"><td>جمع کل</td><td>'+fmt(tot.present)+'</td><td>'+fmt(tot.absent)+'</td><td>'+fmt(tot.leave)+'</td><td>'+(tot.hours?fmt(tot.hours):'—')+'</td><td>'+(tot.ot?fmt(tot.ot):'—')+'</td></tr>';
   html=tbl(['شخص','روز حاضر','غایب','مرخصی','ساعت حضور','اضافه‌کار'],body)}
 } else if(k==='per'){
  const {rows,tot}=personFuelRows();
  if(!rows.length)html='<p class="mut">در این بازه عملیاتی برای اشخاص ثبت نشده است.</p>';
  else{const body=rows.map(x=>'<tr><td>'+x.name+'</td><td>'+fmt(x.ops)+'</td><td>'+fmt(x.liters)+'</td><td>'+fmt(x.amount)+' ریال</td></tr>').join('')
   +'<tr style="font-weight:800"><td>جمع کل</td><td>'+fmt(tot.ops)+'</td><td>'+fmt(tot.liters)+'</td><td>'+fmt(tot.amount)+' ریال</td></tr>';
   html=tbl(['شخص','تعداد عملیات','لیتر','مبلغ'],body)}
 }
 if(!html)return;
 const card=document.createElement('div');card.innerHTML=sumCard(html);

}
const _render=window.render;
window.render=function(){_render.apply(this,arguments);if(view==='rep')buildTotals()};
render();
})();

<script>

/* ===== Road Care V19.0: مرتب‌سازی و یکدست‌سازی گزارش‌ها ===== */
(function(){
'use strict';
const ORDER=[
 ['سوخت و مخزن',['fuel','chg','bal','xfer','tled']],
 ['ناوگان و نگهداری',['work','workday','workop','mcost']],
 ['اشخاص و مالی',['per','dbt','cost','bnk','freight']],
 ['حضور و غیاب',['attend','attendday']],
 ['کنترل',['dis']]];
const LABEL={fuel:'سوخت‌گیری',chg:'شارژ ماهانه کارت‌ها',bal:'سهمیه‌های کارت‌ها',xfer:'انتقال از مرکز به کارت‌ها',tled:'دفتر مخزن',
 work:'کارکرد ماشین‌آلات',workday:'کارکرد روزانه (ساعت ورود و خروج)',workop:'کارکرد رانندگان و اپراتورها',mcost:'هزینه نگهداری و توقف ماشین‌ها',
 per:'عملکرد اشخاص',dbt:'تسویه‌نشده به اشخاص',cost:'هزینه به تفکیک پرداخت‌کننده',bnk:'کارت‌های بانکی (جزئیات تراکنش‌ها)',freight:'بدهی به حمل‌کنندگان',
 attend:'حضور و غیاب ماهانه',attendday:'حضور و غیاب روزانه',dis:'مغایرت و ابطال'};
const REMOVED=['mach','mfph'];
const WD=['شنبه','یکشنبه','دوشنبه','سهشنبه','چهارشنبه','پنجشنبه','جمعه'];
const MO=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const FA='۰۱۲۳۴۵۶۷۸۹',toFa=n=>String(n).replace(/\d/g,d=>FA[+d]),toEn=s=>String(s).replace(/[۰-۹]/g,d=>FA.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const norm=s=>String(s||'').replace(/\u200c/g,'').replace(/\s+/g,' ').trim();

function rebuildSelect(){
 const sel=document.querySelector('#main select[onchange*="R.t=this.value"]');if(!sel)return;
 const cur=R.t;if(REMOVED.includes(cur))R.t='fuel';
 const ops={};[...sel.options].forEach(o=>{ops[o.value]=o.value});
 sel.innerHTML='';
 ORDER.forEach(([g,keys])=>{const keep=keys.filter(k=>ops[k]);if(!keep.length)return;const og=document.createElement('optgroup');og.label=g;
  keep.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=LABEL[k];if(k===R.t)o.selected=true;og.appendChild(o)});sel.appendChild(og)});
 return sel;
}
function setTitle(){
 const t=LABEL[R.t]||'';const head=document.querySelector('.report-head');if(!head)return;
 const h=head.querySelector('h1,h2,h3,.report-title,.report-head-t b,.report-head-t h1,.report-head-t h2')||[...head.querySelectorAll('*')].find(e=>e.children.length===0&&e.textContent.trim().length>3&&!/ROAD|Fleet|گزارش مدیریتی/.test(e.textContent));
 if(h&&t)h.textContent=t;
}
function splitDate(text){
 const m=norm(text).match(/^(\S+) (\S+) (\S+) (\S+)(?:،\s*(.+))?$/);if(!m)return null;
 const wd=m[1].replace(/\u200c/g,''),dd=toEn(m[2]),mi=MO.indexOf(m[3]),yy=toEn(m[4]);
 if(!WD.includes(wd)||mi<0||!/^\d+$/.test(dd)||!/^\d+$/.test(yy))return null;
 const date=toFa(yy)+'/'+toFa(String(mi+1).padStart(2,'0'))+'/'+toFa(dd.padStart(2,'0'));
 return{wd:m[1],date:date+(m[5]?'، '+m[5]:'')};
}
function transformTables(){
 document.querySelectorAll('#main .report-table').forEach(t=>{
  const hr=t.rows[0];if(!hr)return;const heads=[...hr.cells].map(c=>norm(c.textContent));const n=heads.length;
  // 1) remove "ثبت‌کننده" columns
  const drop=heads.map((h,i)=>/ثبت.?کننده/.test(h)?i:-1).filter(i=>i>=0);
  const rows=[...t.rows];
  rows.forEach(r=>{if(r.cells.length!==n)return;[...drop].sort((a,b)=>b-a).forEach(i=>r.deleteCell(i))});
  const heads2=[...t.rows[0].cells].map(c=>norm(c.textContent));
  // 2) split date columns: numeric date + separate weekday column
  const n2=heads2.length;
  const dateCols=heads2.map((h,i)=>/زمان|تاریخ/.test(h)?i:-1).filter(i=>i>=0);
  dateCols.sort((a,b)=>b-a).forEach(ci=>{
   let ok=true;const parts=[];
   [...t.rows].slice(1).forEach(r=>{if(r.cells.length!==n2)return;const p=splitDate(r.cells[ci].textContent);parts.push(p);});
   if(!parts.length||parts.some(p=>p===null&&false))return;
   const hasAny=parts.some(p=>p);if(!hasAny)return;
   // header
   const th=t.rows[0].cells[ci];const nh=document.createElement('th');nh.textContent='روز هفته';nh.style.cssText='min-width:96px;white-space:nowrap';th.parentNode.insertBefore(nh,th.nextSibling);th.textContent='تاریخ'+(/زمان/.test(th.textContent)?'':'');
   let k=0;[...t.rows].slice(1).forEach(r=>{if(r.cells.length!==n2)return;const p=parts[k++];const c=r.cells[ci];const td=document.createElement('td');td.style.cssText='min-width:96px;white-space:nowrap';
    if(p){c.textContent=p.date;td.textContent=p.wd}else td.textContent='—';c.parentNode.insertBefore(td,c.nextSibling)});
  });
 });
}
function numTok(s){const m=toEn(norm(s)).match(/^(-?[\d,٬٫.]+)/);if(!m)return null;const v=parseFloat(m[1].replace(/[,٬]/g,''));return isNaN(v)?null:v}
function genericSummary(){
 const t=document.querySelector('#main .report-table');if(!t)return'';const hr=t.rows[0];if(!hr)return'';
 const heads=[...hr.cells].map(c=>norm(c.textContent));const body=[...t.rows].slice(1).filter(r=>r.cells.length===heads.length&&!/^جمع/.test(norm(r.cells[0].textContent)));
 const cols=[];heads.forEach((h,i)=>{const vals=body.map(r=>norm(r.cells[i].textContent)).filter(v=>v&&v!=='—');if(!vals.length)return;const nums=vals.map(numTok);const good=nums.filter(x=>x!==null);
  if(good.length>=Math.ceil(vals.length*0.8)&&!/تاریخ|زمان|ساعت ورود|ساعت خروج|روز هفته|وضعیت|ماشین|شخص|نام|کد|پلاک|توضیح/.test(h)){cols.push([h,good.reduce((a,b)=>a+b,0)])}});
 const rowsHtml=cols.length?cols.map(([h,v])=>'<tr><td>'+h+'</td><td><b>'+toFa((Math.round(v*10)/10).toLocaleString('en-US'))+'</b></td></tr>').join(''):'';
 return cols.length?'<div class="sc"><table><tr><th>ستون</th><th>جمع</th></tr>'+rowsHtml+'</table></div>':'<p class="mut">تعداد ردیف‌ها: '+toFa(body.length)+'</p>';
}
function fixSummary(){
 const sheet=document.querySelector('#main .report-sheet');if(!sheet)return;
 let sm=sheet.querySelector('.report-summary');const sc=document.getElementById('sumcard');
 let inner='';
 if(sc){inner=sc.innerHTML;sc.remove()} else inner=genericSummary();
 if(!sm){sm=document.createElement('section');sm.className='report-summary';const f=sheet.querySelector('.report-footer');if(f)sheet.insertBefore(sm,f);else sheet.appendChild(sm)}
 sm.innerHTML='<h3>خلاصه گزارش</h3>'+inner.replace(/<h3>[^<]*<\/h3>/,'');
 const old=document.getElementById('unitsum');if(old)old.remove();
}
const _render=window.render;
window.render=function(){_render.apply(this,arguments);
 if(view!=='rep')return;
 rebuildSelect();setTitle();transformTables();fixSummary();
};
render();
})();
</script>
<script>

/* ===== Road Care V20.0: حذف خلاصهٔ گزارش‌ها؛ جمع هر آیتم در یک ردیف زیر همان آیتم ===== */
(function(){
'use strict';
const FA='۰۱۲۳۴۵۶۷۸۹',toFa=s=>String(s).replace(/\d/g,d=>FA[+d]),toEn=s=>String(s).replace(/[۰-۹]/g,d=>FA.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const norm=s=>String(s||'').replace(/\u200c/g,'').replace(/\s+/g,' ').trim();
const ITEM=/^(ماشین|شخص|راننده|راننده یا اپراتور|پرداخت‌کننده و منبع|پرداخت‌کننده|مخزن|منبع|سریال)$/;
const SKIP=/تاریخ|زمان|روز هفته|وضعیت|ورود|خروج|کد|پلاک|توضیح|ثبت|سریال|کارت|منبع|راننده|پرداخت|مخزن|موجودی|بر |نقش|نام|شخص|ماشین|سوخت‌گیرنده|مبلغ \(ریال\) ?$/;
function parsePieces(text){  const out=[];norm(text).split('،').forEach(p=>{const t=toEn(norm(p)).trim();const hm=t.match(/^(\d+):(\d{2})$/);if(hm){out.push({v:(+hm[1])*60+(+hm[2]),u:'__min'});return}const m=t.match(/^(-?[\d.,٬٫]+)\s*(.*)$/);if(!m)return;const v=parseFloat(m[1].replace(/[,٬]/g,'').replace('٫','.'));if(isNaN(v))return;out.push({v,u:(m[2]||'').trim()})});  return out; } function fmt(x){return toFa((Math.round(x*10)/10).toLocaleString('en-US'))}
function run(){
 document.querySelectorAll('#main .report-table').forEach(t=>{
  const hr=t.rows[0];if(!hr)return;const heads=[...hr.cells].map(c=>norm(c.textContent));const n=heads.length;
  const body=[...t.rows].slice(1).filter(r=>{const f=norm(r.cells[0]?r.cells[0].textContent:'');return r.cells.length===n&&!/^جمع/.test(f)});
  // remove old grand-total rows
  [...t.rows].slice(1).forEach(r=>{if(!body.includes(r))r.remove()});
  const PRI=['ماشین','شخص','راننده یا اپراتور','راننده','پرداخت‌کننده و منبع','پرداخت‌کننده','مخزن','منبع','سریال'];
  let gi=-1;for(const p of PRI){const j=heads.indexOf(p);if(j>=0){gi=j;break}}
  const numCols=heads.map((h,i)=>{if(i===gi||SKIP.test(h))return false;const vals=body.map(r=>norm(r.cells[i].textContent)).filter(v=>v&&v!=='—');if(!vals.length)return false;const ok=vals.filter(v=>parsePieces(v).length>0).length;return ok>=Math.ceil(vals.length*0.8)});
  if(gi<0||!numCols.some(Boolean)){
   // no items: keep rows as they are (no per-item totals)
   return;
  }
  // group rows by item, keep first-appearance order
  const order=[],groups={};
  body.forEach(r=>{const k=norm(r.cells[gi].textContent)||'—';if(!groups[k]){groups[k]=[];order.push(k)}groups[k].push(r)});
  const parent=body[0].parentNode;
  order.forEach(k=>{
   const rows=groups[k];rows.forEach(r=>parent.appendChild(r));
   const tr=document.createElement('tr');tr.className='item-total';tr.style.cssText='font-weight:800;background:var(--axis-soft)';
   heads.forEach((h,i)=>{const td=document.createElement('td');
    if(i===0)td.textContent='مجموع';
    else if(numCols[i]){const acc={};rows.forEach(r=>parsePieces(r.cells[i].textContent).forEach(({v,u})=>acc[u]=(acc[u]||0)+v));
     td.textContent=Object.entries(acc).map(([u,v])=>u==='__min'?hmFmt(v/60):fmt(v)+(u?' '+u:'')).join('، ')||'—'}
    tr.appendChild(td)});
   parent.appendChild(tr);
  });
 });
}
function dropSummaries(){
 document.querySelectorAll('#main .report-summary,#sumcard,#unitsum').forEach(e=>e.remove());
}
const _render=window.render;
window.render=function(){_render.apply(this,arguments);if(view!=='rep')return;dropSummaries();run()};
render();
})();
</script>

/* ===== Road Care V21.0: حضور و غیاب ماهانه ===== */
(function(){
'use strict';
const _rd=window.repData;
const MFMT=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'long',year:'numeric'});
window.repData=function(){
 if(R.t!=='attend')return _rd.apply(this,arguments);
 const inR=d=>String(d).slice(0,10)>=R.from&&String(d).slice(0,10)<=R.to;
 const A=(S.attend||[]).filter(a=>!a.superseded&&inR(a.date)&&(!R.p||a.name===R.p));
 const by={};
 A.forEach(a=>{const mk=MFMT.format(new Date(String(a.date).slice(0,10)+'T12:00:00'));const key=mk+'|'+a.name;
  const g=by[key]=by[key]||{month:mk,name:a.name,d:String(a.date).slice(0,10),present:0,absent:0,leave:0,hours:0,ot:0};if(String(a.date).slice(0,10)<g.d)g.d=String(a.date).slice(0,10);
  if(a.state==='present'){g.present++;g.hours+=a.hours||0;g.ot+=a.ot||0}else if(a.state==='absent')g.absent++;else if(a.state==='leave')g.leave++});
 const keys=Object.keys(by).sort((x,y)=>by[x].name.localeCompare(by[y].name)||by[x].d.localeCompare(by[y].d));
 return{h:['ماه','شخص','روز حاضر','روز غایب','روز مرخصی','ساعت حضور','اضافه‌کار (ساعت)'],
  r:keys.map(k=>{const g=by[k];return[g.month,g.name,fn(g.present),fn(g.absent),fn(g.leave),g.hours?fn(Math.round(g.hours*10)/10):'—',g.ot?fn(Math.round(g.ot*10)/10):'—']})};
};

/* ===== Road Care V22.0: حضور ماهانه با انتخاب ماه؛ چاپ فقط خود گزارش (بدون برگ اضافه) ===== */
(function(){
'use strict';
if(!document.getElementById('v22css')){const st=document.createElement('style');st.id='v22css';st.textContent=`
@media print{
 html,body{margin:0!important;padding:0!important;height:auto!important;min-height:0!important;background:#fff!important}
 .report-sheet{min-height:0!important;height:auto!important;margin:0!important;page-break-after:auto!important}
 body::after,#main::after,body::before{content:none!important;display:none!important}
}`;document.head.appendChild(st)}
const PMF=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'numeric'});
const pkey=d=>{const p=PMF.formatToParts(d);return p.find(x=>x.type==='year').value+'/'+p.find(x=>x.type==='month').value};
const dayAdd=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
// شروع و پایان ماه شمسی که تاریخ داده‌شده در آن است
const mStart=iso=>{const k=pkey(new Date(iso+'T12:00:00Z'));let x=iso;for(let i=0;i<40;i++){const p=dayAdd(x,-1);if(pkey(new Date(p+'T12:00:00Z'))!==k)break;x=p}return x};
const mEnd=iso=>{const k=pkey(new Date(iso+'T12:00:00Z'));let x=iso;for(let i=0;i<40;i++){const n=dayAdd(x,1);if(pkey(new Date(n+'T12:00:00Z'))!==k)break;x=n}return x};
const _render=window.render;
window.render=function(){
 const att=R.t==='attend';
 if(att){if(R.from)R.from=mStart(R.from);if(R.to)R.to=mEnd(R.to)}
 _render.apply(this,arguments);
 if(view!=='rep'||!att)return;
 ['from','to'].forEach(k=>{const d=document.getElementById('jd_'+k+'_d');if(d&&d.style.display!=='none'){d.style.display='none';d.parentElement.style.gridTemplateColumns='1.6fr 1.2fr'}});
 document.querySelectorAll('#main label').forEach(l=>{if(l.textContent.trim()==='از تاریخ')l.textContent='از ماه';if(l.textContent.trim()==='تا تاریخ')l.textContent='تا ماه'});
};
render();
})();

<script>

/* ===== Road Care V24.0: چاپ درست؛ فقط گزارش و والدهایش چاپ می‌شوند ===== */
(function(){
'use strict';
if(!document.getElementById('v24css')){const st=document.createElement('style');st.id='v24css';st.textContent='@media print{.rc-hide{display:none!important}}';document.head.appendChild(st)}
function mark(){
 const sh=document.querySelector('.report-sheet');if(!sh)return;
 const keep=new Set();let e=sh;while(e&&e!==document.documentElement){keep.add(e);e=e.parentElement}
 keep.forEach(k=>{[...k.children].forEach(c=>{if(!keep.has(c)&&!/^(SCRIPT|STYLE|LINK|META)$/.test(c.tagName))c.classList.add('rc-hide')})});
}

 mark();

/* ===== Road Care V24.0: چاپ از یک صفحهٔ جداگانهٔ تمیز (فقط خود گزارش) ===== */
(function(){
'use strict';
const PRINT_H=800,MIN_Z=0.7;
function styles(){return [...document.querySelectorAll('style')].map(s=>s.outerHTML).join('\n')}
const nativePrint=window.print.bind(window);
window.print=function(){
 const sh=document.querySelector('.report-sheet');
 if(!sh)return nativePrint();
 const html=sh.outerHTML;
 const old=document.getElementById('rcPrintFrame');if(old)old.remove();
 const f=document.createElement('iframe');f.id='rcPrintFrame';
 f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
 document.body.appendChild(f);
 const d=f.contentDocument||f.contentWindow.document;
 d.open();
 d.write('<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+styles()+'<style>html,body{margin:0!important;padding:0!important;background:#fff!important;height:auto!important}@page{size:A4;margin:8mm}.report-sheet{width:100%!important;max-width:none!important;margin:0!important;box-shadow:none!important;border:0!important}.np,.report-actions{display:none!important}</style></head><body><div id="rcp">'+html+'</div></body></html>');
 d.close();
 const go=()=>{
  try{
   const sh2=d.querySelector('.report-sheet');
   if(sh2){sh2.style.width='733px';const h=sh2.getBoundingClientRect().height;if(h>PRINT_H){const z=PRINT_H/h;if(z>=MIN_Z)sh2.style.zoom=z.toFixed(3)}}
  }catch(e){}
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){}},150);
 };
 if(d.readyState==='complete')go();else f.onload=go;
 const clean=()=>{setTimeout(()=>{const x=document.getElementById('rcPrintFrame');if(x)x.remove()},60000)};
 f.contentWindow.addEventListener('afterprint',clean);
};
})();

function rolesCard(){

/* ===== Road Care V26.0: پشتیبان روزانه با نام لاتین و تاریخ شمسی؛ پشتیبان‌های تکراری ساخته نمی‌شوند ===== */
(function(){
'use strict';
const PF=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'});
function jdate(d){const p={};PF.formatToParts(d).forEach(x=>p[x.type]=x.value);return p.year+'.'+p.month+'.'+p.day}
function hash(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return (h>>>0).toString(36)+':'+str.length}
window.bkOut=function(){
 try{
  const d=new Date();const day=jdate(d);
  const payload=JSON.stringify({app:'road-care',version:2,at:d.toISOString(),jdate:day,data:S},null,1);
  const hk=hash(JSON.stringify(S));
  const last=JSON.parse(localStorage.getItem('rc_bk_last')||'null');
  if(last&&last.day===day&&last.hash===hk){toast('پشتیبان امروز همین اطلاعات را دارد؛ فایل تازه‌ای ساخته نشد');return}
  localStorage.setItem('rc_bk_last',JSON.stringify({day,hash:hk}));
  const name='Backup Road Care '+day+'.json';
  const blob=new Blob([payload],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('فایل پشتیبان ساخته شد: '+name);
 }catch(e){toast('ساخت فایل پشتیبان ممکن نشد',1)}
};
})();
</script>

 const ev=[];
 (S.freights||[]).filter(x=>!x.void).forEach(x=>ev.push({when:x.when,carrier:x.carrier,kind:'کرایه',trips:x.trips,amt:x.amount,src:x.vehicle?'خودرو: '+x.vehicle:'',cargo:x.cargo||'',rec:''}));
 (S.carrierPays||[]).filter(x=>!x.void).forEach(x=>ev.push({when:x.when,carrier:x.carrier,kind:'پرداخت',trips:'',amt:-x.amount,src:x.src||'',cargo:'',rec:x.receipt||''}));
 ev.sort((a,b)=>String(a.when).localeCompare(String(b.when)));

};

<script>

/* ===== Road Care V47.0: حمل‌کننده و کرایه حمل در فرم تحویل سوخت (به‌جای پرداخت‌کننده و منبع) ===== */
(function(){
'use strict';
const _tOp=window.tOp;
const _tmSave=window.tmSave;
function carrierList(){return (S.carriers||[]).filter(c=>c.active!==false)}
window.tOp=function(ty,id){

 const cs=carrierList();
 modal('<h3>تحویل سوخت به مخزن‌ها</h3>'

  +'<label>تحویل‌گیرنده</label><select id="tm_p"><option value="">انتخاب کنید…</option>'+S.persons.filter(p=>p.active).map(p=>'<option>'+esc(p.name)+'</option>').join('')+'</select>'
  +'<label>حمل‌کننده (شخص یا شرکت)</label>'+(cs.length?'<select id="tm_c" onchange="tmCarrierInfo()"><option value="">انتخاب کنید…</option>'+cs.map(c=>'<option value="'+c.id+'">'+esc(c.name)+' ('+(c.kind==='company'?'شرکت':'شخص')+')</option>').join('')+'</select>':'<p class="mut">حمل‌کننده‌ای ثبت نشده است. از بخش «حمل‌کنندگان» اضافه کنید.</p><select id="tm_c" style="display:none"></select>')
  +'<label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="tm_fc" onchange="tmFreightToggle()" style="width:20px;min-height:20px"> این تحویل کرایه حمل دارد</label>'

  +'<label>مخازن و مقدار هر کدام (لیتر)</label>'+rows
  +'<div class="card" style="margin-top:8px"><b>جمع تحویل: <span id="tm_tot">۰</span> ل</b> <small class="mut" id="tm_cnt"></small></div>'
  +'<label>توضیحات (اختیاری)</label><input id="tm_n">'
  +'<br><button class="btn" onclick="tmSave()">ثبت تحویل</button> <button class="btn g" onclick="modal()">انصراف</button>');
 setTimeout(()=>{tlTotal();if(id){const el=document.querySelector('.tl[data-id="'+id+'"]');if(el)el.focus()}},50);
};

(function(){

const ICON={
 'تغییر نرخ':'<path d="M12 3v18M16 7H10a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H6"/>',

const LABEL={'تغییر نرخ':'نرخ','برداشت':'برداشت','تحویل سوخت':'تحویل','شارژ سهمیه ماهانه':'سهمیه','اندازه‌گیری':'اندازه','پایان ماه':'پایان ماه','ویرایش':'ویرایش','غیرفعال‌سازی':'غیرفعال','فعال‌سازی':'فعال','حذف':'حذف'};
const ORDER=['برداشت','تحویل سوخت','شارژ سهمیه ماهانه','اندازه‌گیری','پایان ماه','تغییر نرخ','ویرایش','غیرفعال‌سازی','فعال‌سازی','حذف'];
function restyle(){

/* ===== Road Care V52.0: همهٔ انتخابگرهای تاریخ شمسی؛ مقدار ورودی بدون تغییر ===== */
(function(){
'use strict';
const FA='۰۱۲۳۴۵۶۷۸۹';
const toFa=x=>String(x).replace(/\d/g,d=>FA[+d]);
const toEn=x=>String(x).replace(/[۰-۹]/g,d=>FA.indexOf(d));
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const PF=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'});
function g2j(iso){const p={};PF.formatToParts(new Date(iso+'T12:00:00Z')).forEach(x=>p[x.type]=+x.value);return[p.year,p.month,p.day]}
function j2g(jy,jm,jd){
 const days=(jm<=6?(jm-1)*31:186+(jm-7)*30)+jd-1;
 let d=new Date(Date.UTC(jy+621,2,21+days,12));
 for(let k=0;k<8;k++){const iso=d.toISOString().slice(0,10),j=g2j(iso),df=(j[0]*372+j[1]*31+j[2])-(jy*372+jm*31+jd);if(!df)return iso;d=new Date(d.getTime()-Math.sign(df)*864e5)}
 return null;
}
function isoOf(v){return v?String(v).slice(0,10):''}
function build(inp){
 const isDT=inp.type==='datetime-local';
 const cur=inp.value?String(inp.value):'';
 const iso=isoOf(cur)||isoOf(new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString());
 const [jy,jm,jd]=g2j(iso);
 const time=isDT&&cur.length>10?cur.slice(11,16):'';
 const wrap=document.createElement('div');wrap.className='jd-wrap';wrap.dataset.jd='1';
 wrap.style.cssText='display:grid;grid-template-columns:1fr 1.5fr 1.1fr;gap:6px;align-items:center;margin:0';
 const opt=(n,sel,t)=>'<option value="'+n+'"'+(n==sel?' selected':'')+'>'+t+'</option>';
 const yrs=[];for(let y=jy-4;y<=jy+2;y++)yrs.push(y);
 wrap.innerHTML='<select class="jd-d" aria-label="روز" style="min-height:44px">'+Array.from({length:31},(_,i)=>opt(i+1,jd,toFa(i+1))).join('')+'</select>'
  +'<select class="jd-m" aria-label="ماه" style="min-height:44px">'+JM.map((m,i)=>opt(i+1,jm,m)).join('')+'</select>'
  +'<select class="jd-y" aria-label="سال" style="min-height:44px">'+yrs.map(y=>opt(y,jy,toFa(y))).join('')+'</select>'
  +(isDT?'<input class="jd-t" type="time" value="'+(time||'00:00')+'" style="min-height:44px;grid-column:1 / span 3">':'');
 inp.type='hidden';inp.dataset.jdEnhanced='1';
 inp.parentNode.insertBefore(wrap,inp);
 const sync=()=>{const d=+wrap.querySelector('.jd-d').value,m=+wrap.querySelector('.jd-m').value,y=+wrap.querySelector('.jd-y').value;
  let g=j2g(y,m,Math.min(d,31));let dd=d;while(!g&&dd>28){dd--;g=j2g(y,m,dd)}
  if(!g)return;
  if(isDT){const t=(wrap.querySelector('.jd-t')||{}).value||'00:00';inp.value=g+'T'+t}else inp.value=g;
  inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new Event('change',{bubbles:true}));
 };
 wrap.querySelectorAll('select,input').forEach(el=>el.addEventListener('change',sync));
 wrap.querySelectorAll('select,input').forEach(el=>el.addEventListener('input',sync));
 if(!inp.value)sync();
}
function enhanceAll(root){
 (root||document).querySelectorAll('input[type="datetime-local"],input[type="date"]').forEach(inp=>{if(inp.dataset.jdEnhanced)return;build(inp)});
}
const mo=new MutationObserver(()=>enhanceAll(document));
mo.observe(document.body,{childList:true,subtree:true});
enhanceAll(document);
})();
</script>
<script>

/* ===== Road Care V53.0: حذف ماشین بدون کارت؛ فقط وقتی عملیاتش توسط همان کاربر ابطال شده باشد ===== */
(function(){
'use strict';
const ALLOWED=()=>['admin','site'].includes(S.settings.role);
const who=()=>S.settings.user||'';
function opsOf(ref){
 const tx=(S.tx||[]).filter(t=>!t.void&&(t.mref===ref||t.recv===ref));
 const work=(S.work||[]).filter(w=>!w.superseded&&w.ref===ref);
 const svc=(S.svc||[]).filter(x=>!x.void&&x.ref===ref);
 const faults=(S.faults||[]).filter(x=>!x.void&&x.ref===ref);
 const reads=(S.reads||[]).filter(x=>!x.void&&x.ref===ref);
 return{tx,work,svc,faults,reads};
}
function summarize(o){return{total:o.tx.length+o.work.length+o.svc.length+o.faults.length+o.reads.length}}
function ownerOf(x){return x.by||''}
window.fleetEdit=function(ref){if(String(ref).startsWith('c:'))return cardForm(String(ref).slice(2));return machForm(String(ref).slice(2))};
window.machDelForm=function(ref){
 if(!ALLOWED())return toast('فقط مدیر و مسئول کارگاه می‌توانند ماشین را حذف کنند',1);
 const m=(S.machines||[]).find(x=>'m:'+x.id===ref);if(!m)return;
 const o=opsOf(ref),n=summarize(o).total;
 const others=[...o.tx,...o.work,...o.svc,...o.faults,...o.reads].filter(x=>ownerOf(x)!==who());
 if(others.length)return modal('<h3>حذف ممکن نیست</h3><p><b>'+esc(m.name)+'</b> دارای <b>'+fn(others.length)+'</b> عملیات ثبت‌شده توسط کاربران دیگر است.</p><p class="mut">حذف فقط وقتی ممکن است که عملیات‌ها توسط همان کاربر ثبت شده باشند؛ کاربران دیگر باید عملیات خودشان را ابطال کنند.</p><button class="btn g" onclick="modal()">بستن</button>');
 if(n)return modal('<h3>حذف ممکن نیست</h3><p>این ماشین <b>'+fn(n)+'</b> عملیات دارد. ابتدا عملیات‌ها را ابطال کنید، سپس ماشین را حذف کنید.</p><button class="btn g" onclick="modal()">بستن</button>');const body='<p class="mut">این ماشین عملیات فعالی ندارد.</p>';
 modal('<h3>حذف ماشین</h3><p><b>'+esc(m.name)+'</b> <span class="tg">'+esc(m.code||'')+'</span></p>'+body
  +'<label>علت حذف (الزامی)</label><input id="md_why">'
  +'<p class="mut" style="font-size:.85rem">قبل از حذف یک فایل پشتیبان دانلود می‌شود و حذف در گزارش مغایرت ثبت می‌شود.</p>'
  +'<br><button class="btn d" onclick="machDelRun(\''+ref+'\')">'+(n?'ابطال عملیات‌ها و حذف':'حذف ماشین')+'</button> <button class="btn g" onclick="modal()">انصراف</button>');
};
window.machDelRun=function(ref){
 if(!ALLOWED())return toast('دسترسی ندارید',1);
 const why=(document.getElementById('md_why')||{value:''}).value.trim();if(!why)return toast('علت حذف را بنویسید',1);
 const m0=(S.machines||[]).find(x=>'m:'+x.id===ref);if(!m0)return;
 const o0=opsOf(ref);
 const others=[...o0.tx,...o0.work,...o0.svc,...o0.faults,...o0.reads].filter(x=>ownerOf(x)!==who());
 if(others.length)return toast('عملیات کاربران دیگر وجود دارد؛ حذف ممکن نیست',1);
 if(typeof bkOut==='function')bkOut();
 const T=clone(S);const at=new Date().toISOString(),by=T.settings.user;
 const mark=x=>{x.void={reason:'حذف ماشین: '+why,by,at}};
 const o=opsOf(ref);
 o.tx.forEach(t=>{const tt=T.tx.find(y=>y.id===t.id);if(tt)mark(tt);T.tx.forEach(y=>{if(y.forFuel===t.id&&!y.void)y.void={reason:'حذف ماشین: '+why,by,at}})});
 o.work.forEach(w=>{const tw=T.work.find(y=>y.id===w.id);if(tw)tw.superseded={reason:'حذف ماشین: '+why,by,at}});
 o.svc.forEach(x=>{const tx=T.svc.find(y=>y.id===x.id);if(tx)mark(tx)});
 o.faults.forEach(x=>{const tx=T.faults.find(y=>y.id===x.id);if(tx)mark(tx)});
 o.reads.forEach(x=>{const tx=T.reads.find(y=>y.id===x.id);if(tx)mark(tx)});

<script>

window.carrierEditForm=function(kind,id){

   :'<label>مبلغ پرداخت (ریال)</label><input id="ce_a" inputmode="decimal" value="'+x.amount+'"><label>شمارهٔ رسید (اختیاری)</label><input id="ce_r" value="'+esc(x.receipt||'')+'">')

 const T=clone(S);const isF=kind==='freight';const list=isF?T.freights:T.carrierPays;const x=(list||[]).find(y=>y.id===id);if(!x||x.void)return;
 const before={when:x.when,amount:x.amount,trips:x.trips,rate:x.rate,cargo:x.cargo,receipt:x.receipt};

 if(isF){const t=N(document.getElementById('ce_t').value),p=N(document.getElementById('ce_p').value);if(!(t>0)||!(p>0))return toast('تعداد سفر و کرایه معتبر وارد کنید',1);patch.trips=t;patch.rate=p;patch.amount=Math.round(t*p);patch.cargo=(document.getElementById('ce_c').value||'').trim();
  const pays=paidFor(x.carrier,null);const owed=owedFor(x.carrier,x.id)+patch.amount;if(pays>owed)return toast('با این مبلغ، بدهی کمتر از پرداخت‌های ثبت‌شده می‌شود',1)}
 else{const a=N(document.getElementById('ce_a').value);if(!(a>0))return toast('مبلغ معتبر وارد کنید',1);const others=paidFor(x.carrier,x.id);if(others+a>owedFor(x.carrier,null))return toast('مجموع پرداخت‌ها از بدهی بیشتر می‌شود',1);patch.amount=a;patch.receipt=(document.getElementById('ce_r').value||'').trim()}

(function(){

const _tOp=window.tOp;
function srcChoices(){
 const seen={};const out=[];
 (S.tanks||[]).filter(k=>k.active!==false).forEach(k=>{const key=tpoolKey(k);if(seen[key])return;seen[key]=1;
  const label=key.startsWith('P:')?('پروژه '+key.slice(2)):('مخزن '+k.name+' (بدون پروژه)');

}

const RATE_ICON='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M16 7H10a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H6"/></svg>';

/* ===== Road Care V63.0: نمایش ساعت به شکل ساعت:دقیقه (مبنای ۶۰ دقیقه) ===== */
(function(){
'use strict';
const FA='۰۱۲۳۴۵۶۷۸۹';
const toFa=x=>String(x).replace(/\d/g,d=>FA[+d]);
const toEn=x=>String(x).replace(/[۰-۹]/g,d=>FA.indexOf(d)).replace(/٫/g,'.');
window.hmFmt=function(h){if(h===null||h===undefined||h===''||isNaN(+h))return'';const m=Math.round(+h*60);const H=Math.floor(m/60),M=m%60;return toFa(H)+':'+toFa(String(M).padStart(2,'0'))};
const _wk=window.wkCalc;
window.wkCalc=function(){_wk.apply(this,arguments);const el=document.getElementById('wk2_h');if(el&&el.value!=='')el.value=hmFmt(parseFloat(toEn(el.value)))};
const _atTm=window.atTm;
window.atTm=function(){_atTm.apply(this,arguments);const r=document.querySelector('[id^="atr"]');document.querySelectorAll('#main .ah').forEach(el=>{if(el.value!=='')el.value=hmFmt(parseFloat(toEn(el.value)))})};

 document.querySelectorAll('#main .report-table').forEach(t=>{
  const hr=t.rows[0];if(!hr)return;

<script>

/* ===== Road Care V64.0: وضعیت روزانهٔ خودرو بر اساس حضور راننده؛ با تأیید کاربر ===== */
(function(){
'use strict';
const isOn=m=>m.active!==false;
function dayVehicles(name){
 return [...(S.cards||[]).filter(c=>!c.archived&&c.active&&c.driver===name).map(c=>({ref:'c:'+c.id,name:c.name,code:c.code||c.serial,rented:!!c.rented,susp:!!(c.susp&&c.susp.from)})),
  ...(S.machines||[]).filter(m=>isOn(m)&&m.driver===name).map(m=>({ref:'m:'+m.id,name:m.name,code:m.code||'',rented:!!m.rented,susp:!!(m.susp&&m.susp.from)}))]
  .filter(v=>!v.rented&&!v.susp);
}

 const rows=[];
 people.forEach(name=>{const st=stateOf(name,date);dayVehicles(name).forEach(v=>{
  const prev=((S.vehDay||{})[date]||{})[v.ref];
  const defOn=prev?prev.on:(st==='present');
  rows.push({...v,name2:name,st,defOn,reason:prev&&!prev.on?prev.reason:(st==='absent'||st==='leave'?'راننده '+(st==='absent'?'غایب':'مرخصی'):'')})})});
 if(!rows.length)return;
 modal('<h3>وضعیت خودروها در '+esc(fd(date+'T12:00').split(/[,،]/)[0])+'</h3><p class="mut" style="font-size:.85rem;margin:0 0 8px">پیش‌فرض بر اساس حضور راننده است. اگر خودرو با وجود حضور راننده در تعمیر است، «غیرفعال» را انتخاب و علت را بنویسید. این وضعیت فقط برای همین روز است.</p>'
  +rows.map((r,i)=>'<div class="mc-it" style="padding:8px 10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>'+esc(r.name)+'</b> <small class="mut">'+esc(r.code)+'</small><small style="display:block" class="mut">راننده: '+esc(r.name2)+' · '+(r.st==='present'?'حاضر':r.st==='absent'?'غایب':r.st==='leave'?'مرخصی':'بدون حضور ثبت‌شده')+'</small></div>'

 _form.apply(this,arguments);
 const box=document.querySelector('#m .box');if(!box||!rv)return;
 const on=rv.active!==false;
 const row=document.createElement('div');row.className='sw-row';row.id='vs_activeRow';
 row.innerHTML='<div><b>خودرو فعال است</b><small>خاموش کردن، خودرو را غیرفعال می‌کند</small></div>'
  +'<label class="sw-tgl"><input type="checkbox" id="vs_active"'+(on?' checked':'')+' onchange="vsActiveToggle()"><span></span></label>';
 const offBox=document.createElement('div');offBox.id='vs_activeWhy';offBox.style.display=on?'none':'block';
 offBox.innerHTML='<label>دلیل غیرفعال بودن</label><input id="vs_activeReason" placeholder="مثلاً فروخته‌شده یا برگشت به طرف قرارداد" value="'+String(rv.inactiveReason||'').replace(/"/g,'&quot;')+'">';
 const h=box.querySelector('.rs-s')||box.firstElementChild;
 if(h&&h.parentNode)h.parentNode.insertBefore(row,h.nextSibling);else box.insertBefore(row,box.firstChild);
 row.parentNode.insertBefore(offBox,row.nextSibling);
};
window.vsActiveToggle=function(){
 const on=document.getElementById('vs_active').checked;
 const w=document.getElementById('vs_activeWhy');if(w)w.style.display=on?'none':'block';
};
const _save=window.vehStatusSave;
window.vehStatusSave=function(ref){
 const tg=document.getElementById('vs_active');
 const want=tg?tg.checked:null;
 const why=((document.getElementById('vs_activeReason')||{}).value||'').trim();
 if(want===false&&!why)return toast('دلیل غیرفعال بودن را بنویسید',1);
 _save.apply(this,arguments);
 if(want===null)return;
 const rv=recOfRef(ref);if(!rv)return;
 if((rv.active!==false)===want&&(want||!rv.inactiveReason&&!why))return;
 const T=clone(S);const x=listOf(T,ref).find(y=>y.id===String(ref).slice(2));if(!x)return;
 x.active=want;
 if(!want){x.inactiveReason=why;x.inactiveFrom=nowL().slice(0,10)}else{x.inactiveReason='';x.inactiveFrom=''}
 (x.statusHist=x.statusHist||[]).push({at:new Date().toISOString(),by:T.settings.user,changes:want?'فعال شد':'غیرفعال شد: '+why});
 commit(T);render();
};
const _render=window.render;
window.render=function(){
 _render.apply(this,arguments);
 const main=document.getElementById('main');if(!main)return;
 if(view==='det'||view==='mdet'){
  main.querySelectorAll('button').forEach(b=>{if(/togMachine\(|toggleCard\(/.test(b.getAttribute('onclick')||''))b.style.display='none'});
 }
};
render();
})();
</script>
<script>

/* ===== Road Care V105.0: استیجاری فقط مالکیت است؛ توقف موقت با کلید و دلیل؛ کلیدهای یکدست ===== */
(function(){
'use strict';
const today=()=>nowL().slice(0,10);
const yest=()=>{const d=new Date(today()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)};
const recOfRef=ref=>{const id=String(ref).slice(2);return String(ref)[0]==='c'?(S.cards||[]).find(x=>x.id==id):(S.machines||[]).find(x=>x.id==id)};
const listOf=(T,ref)=>String(ref)[0]==='c'?T.cards:T.machines;
const STOPS=['تعمیرات اساسی','پایان کار','سایر'];
const suspOn=(v,d)=>{const s=v&&v.susp;return !!(s&&s.from&&d>=s.from&&(!s.to||d<=s.to))};
/* ---- استیجاری دیگر خودرو را از سرویس و بازرسی خارج نمی‌کند ---- */
window.vehOff=function(ref){const v=recOfRef(ref);if(!v)return false;return suspOn(v,today())};
window.offReasonOn=function(ref,date){return ''};
/* ---- استایل یکدست کلیدها ---- */
if(!document.getElementById('v105css')){const st=document.createElement('style');st.id='v105css';st.textContent=`
.vs-sw{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card)}
.vs-sw b{font-size:.8rem;display:block;font-weight:700}
.vs-sw small{display:block;color:var(--muted);font-size:.68rem;margin-top:1px;line-height:1.4}
.vs-tg{position:relative;width:52px;height:30px;flex:none}
.vs-tg input{opacity:0;width:0;height:0;position:absolute}
.vs-tg span{position:absolute;inset:0;background:#c9d2dc;border-radius:99px;transition:.2s;cursor:pointer}
.vs-tg span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.vs-tg input:checked + span{background:var(--ok)}
.vs-tg input:checked + span:before{transform:translateX(22px)}
.vs-box{margin:0 0 6px;padding:2px 2px 0}
`;document.head.appendChild(st)}
function sw(id,title,sub,on,boxId){
 return '<div class="vs-sw"><div><b>'+title+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div><label class="vs-tg"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+' onchange="vsSwitch(this,\''+boxId+'\')"><span></span></label></div>';
}
window.vsSwitch=function(cb,boxId){if(!boxId)return;const b=document.getElementById(boxId);if(b)b.style.display=cb.checked?'block':'none'};
/* ---- فرم یکپارچه ---- */
window.vehStatusForm=function(ref){
 const v=recOfRef(ref);if(!v)return;
 const active=v.active!==false;
 const s=v.susp;const stopOn=!!(s&&s.from&&(!s.to||s.to>=today()));
 const stopCur=s&&s.reason?(STOPS.includes(s.reason)?s.reason:'سایر'):'تعمیرات اساسی';
 const other=s&&s.reason&&!STOPS.includes(s.reason)?s.reason:'';
 const endOn=!!(s&&s.to);
 R.vs_from=(s&&s.from)||today();R.vs_to=(s&&s.to)||today();
 modal('<div class="rs-t">وضعیت خودرو</div><div class="rs-s">'+esc(v.name)+'</div>'
  +sw('vs_active','خودرو فعال است','خاموش کردن، خودرو را غیرفعال می‌کند',active,'vs_activeWhy')
  +'<div id="vs_activeWhy" class="vs-box" style="display:'+(active?'none':'block')+'"><label>دلیل غیرفعال بودن</label><input id="vs_activeReason" placeholder="مثلاً فروخته‌شده یا برگشت به طرف قرارداد" value="'+esc(v.inactiveReason||'')+'"></div>'
  +sw('vs_rent','خودروی استیجاری است','فقط مالکیت را نشان می‌دهد؛ از سرویس و بازرسی خارج نمی‌کند',!!v.rented,'vs_rentBox')
  +'<div id="vs_rentBox" class="vs-box" style="display:'+(v.rented?'block':'none')+'"><label>مالک یا شرکت طرف قرارداد (اختیاری)</label><input id="vs_owner" value="'+esc(v.rentOwner||'')+'"></div>'
  +sw('vs_stop','توقف بازرسی و سرویس','خارج کردن خودرو از برنامه‌های بازرسی و سرویس',stopOn,'vs_stopBox')
  +'<div id="vs_stopBox" class="vs-box" style="display:'+(stopOn?'block':'none')+'">'
   +'<label>از تاریخ</label>'+jdSel('vs_from',R.vs_from)
   +sw('vs_end','تاریخ پایان دارد','با روشن شدن، تاریخ پایان پرسیده می‌شود',endOn,'vs_endBox')
   +'<div id="vs_endBox" class="vs-box" style="display:'+(endOn?'block':'none')+'">'+jdSel('vs_to',R.vs_to)+'</div>'
  +'</div>'
  +'<div style="display:flex;gap:8px;margin-top:12px"><button class="btn rs-b" style="flex:1" onclick="vehStatusSave(\''+ref+'\')">ذخیره</button><button class="btn g rs-b" style="flex:1" onclick="modal()">انصراف</button></div>');
 const bx=document.querySelector('#m .box');if(bx)bx.classList.add('rs-box');
};
window.vsStopReason=function(sel){const x=document.getElementById('vs_rx');if(x)x.style.display=sel.value==='سایر'?'block':'none'};
window.vehStatusSave=function(ref){
 const T=clone(S);const x=listOf(T,ref).find(y=>y.id===String(ref).slice(2));if(!x)return;
 const at=new Date().toISOString(),by=T.settings.user;const notes=[];
 const wantActive=!!document.getElementById('vs_active').checked;
 const wantRent=!!document.getElementById('vs_rent').checked;
 const wantStop=!!document.getElementById('vs_stop').checked;
 const wantEnd=!!document.getElementById('vs_end')&&document.getElementById('vs_end').checked;
 /* فعال / غیرفعال */
 if(!wantActive){
  const why=((document.getElementById('vs_activeReason')||{}).value||'').trim();
  if(!why)return toast('دلیل غیرفعال بودن را بنویسید',1);
  if(x.active!==false)x.inactiveFrom=today();
  x.active=false;x.inactiveReason=why;notes.push('غیرفعال: '+why);
 }else{
  if(x.active===false)notes.push('فعال شد');
  x.active=true;x.inactiveReason='';x.inactiveFrom='';
 }
 /* استیجاری (مالکیت) */
 x.rented=wantRent;
 x.rentOwner=wantRent?((document.getElementById('vs_owner')||{}).value||'').trim():'';
 if(wantRent)notes.push('استیجاری');
 /* توقف بازرسی و سرویس */
 if(wantStop){
  let reason='توقف بازرسی و سرویس';
  if(reason==='سایر')reason=((document.getElementById('vs_rx')||{}).value||'').trim();
  
  const from=R.vs_from;if(!from)return toast('تاریخ شروع را انتخاب کنید',1);
  const to=wantEnd?R.vs_to:'';
  if(to&&to<from)return toast('تاریخ پایان قبل از شروع است',1);
  x.susp={reason,from,to:to||''};notes.push('توقف: '+reason);
 }else{
  const s=x.susp;
  if(s&&s.from&&s.from<=yest())x.susp=Object.assign({},s,{to:yest()});else x.susp=null;
 }
 (x.statusHist=x.statusHist||[]).push({at,by,changes:notes.join('، ')||'بدون تغییر'});
 commit(T);modal();toast('وضعیت خودرو ذخیره شد');render();
};
/* ---- حذف دکمه‌های قدیمی فعال/غیرفعال از صفحهٔ خودرو ---- */
const _render=window.render;
window.render=function(){
 _render.apply(this,arguments);
 const main=document.getElementById('main');if(!main)return;
 if(view==='det'||view==='mdet'){
  main.querySelectorAll('button').forEach(b=>{if(/togMachine\(|toggleCard\(/.test(b.getAttribute('onclick')||''))b.style.display='none'});
 }
};
render();
})();
</script>
<script>

/* ===== Road Care V106.0: کلید «خودرو فعال است» برعکس کلیدهای دیگر؛ کادر دلیل فقط وقتی خاموش است ===== */
(function(){
'use strict';
const _sw=window.vsSwitch;
window.vsSwitch=function(cb,boxId){
 if(cb&&cb.id==='vs_active'){
  const b=document.getElementById('vs_activeWhy');
  if(b)b.style.display=cb.checked?'none':'block';
  return;
 }
 return _sw?_sw.apply(this,arguments):undefined;
};
render();
})();
</script>
<script>

/* ===== Road Care V107.0: غیرفعال شدن خودرو در وضعیت نمایش داده شود؛ کلیدهای استیجاری و توقف با خاموش شدن «فعال» خاموش شوند ===== */
(function(){
'use strict';
const _sw=window.vsSwitch;
window.vsSwitch=function(cb,boxId){
 if(cb&&cb.id==='vs_active'&&!cb.checked){
  ['vs_rent','vs_stop'].forEach(id=>{const k=document.getElementById(id);if(k&&k.checked){k.checked=false;const bid=id==='vs_rent'?'vs_rentBox':'vs_stopBox';_sw(k,bid)}});
 }
 return _sw.apply(this,arguments);
};
const _save=window.vehStatusSave;
window.vehStatusSave=function(ref){
 const a=document.getElementById('vs_active');
 if(a&&!a.checked){
  const r=document.getElementById('vs_rent');if(r)r.checked=false;
  const s=document.getElementById('vs_stop');if(s)s.checked=false;
 }
 return _save.apply(this,arguments);
};
const _render=window.render;
window.render=function(){
 _render.apply(this,arguments);
 const main=document.getElementById('main');if(!main)return;
 if(view==='det'||view==='mdet'){
  const ref=view==='det'?'c:'+arg:String(arg||'');
  const id=String(ref).slice(2);
  const v=String(ref)[0]==='c'?(S.cards||[]).find(x=>x.id==id):(S.machines||[]).find(x=>x.id==id);
  if(v&&v.active===false){
   main.querySelectorAll('.chip').forEach(c=>{if(c.textContent.trim()==='عادی'){c.textContent='غیرفعال: '+(v.inactiveReason||'بدون دلیل');c.className='chip over'}});
  }
 }
};
render();
})();
</script>
<script>

/* ===== Road Care V108.0: خودروی غیرفعال؛ بخش‌های جزئیات غیرفعال (جز تغییر وضعیت)؛ کلیدهای استیجاری و توقف قفل ===== */
(function(){
'use strict';
if(!document.getElementById('v108css')){const st=document.createElement('style');st.id='v108css';st.textContent=`
.v108-off{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.vs-sw.v108-lock{opacity:.5;pointer-events:none}
`;document.head.appendChild(st)}
function lockRows(){
 const a=document.getElementById('vs_active');const off=!!a&&!a.checked;
 ['vs_rent','vs_stop'].forEach(id=>{
  const k=document.getElementById(id);if(!k)return;
  const row=k.closest('.vs-sw');
  if(off){k.checked=false;k.disabled=true}else{k.disabled=false}
  if(row)row.classList.toggle('v108-lock',off);
 });
}
const _sw=window.vsSwitch;
window.vsSwitch=function(cb,boxId){
 const r=_sw.apply(this,arguments);
 if(cb&&cb.id==='vs_active')lockRows();
 return r;
};
const _form=window.vehStatusForm;
window.vehStatusForm=function(ref){
 const r=_form.apply(this,arguments);
 lockRows();
 return r;
};
const _render=window.render;
window.render=function(){
 _render.apply(this,arguments);
 const main=document.getElementById('main');if(!main)return;
 if(view==='det'||view==='mdet'){
  const ref=view==='det'?'c:'+arg:String(arg||'');
  const id=String(ref).slice(2);
  const v=String(ref)[0]==='c'?(S.cards||[]).find(x=>x.id==id):(S.machines||[]).find(x=>x.id==id);
  if(v&&v.active===false){
   const keep=[];
   main.querySelectorAll('button,input,select,textarea').forEach(el=>{
    const oc=el.getAttribute('onclick')||'';
    if(/vehStatusForm\(/.test(oc))return;
    el.disabled=true;
   });
   main.querySelectorAll('a[onclick]').forEach(a=>{if(!/vehStatusForm\(/.test(a.getAttribute('onclick')||''))a.style.pointerEvents='none'});
   main.querySelectorAll(':scope > *').forEach(c=>{if(!c.querySelector('button[onclick*="vehStatusForm("]'))c.classList.add('v108-off')});
   main.querySelectorAll('.card,.kpi,.cact-row,.mc-act,.ds-stat').forEach(c=>{if(!c.querySelector('button[onclick*="vehStatusForm("]'))c.classList.add('v108-off')});
  }
 }
};
render();
})();
</script>
<script>

/* ===== Road Care V109.0: توقف بدون دلیل؛ دکمهٔ تغییر وضعیت در جای ثابت و برچسب کوچک ===== */
(function(){
'use strict';
if(!document.getElementById('v109css')){const st=document.createElement('style');st.id='v109css';st.textContent=`
.v109-row{display:flex!important;flex-wrap:nowrap!important;align-items:center!important;justify-content:space-between!important;gap:8px!important}
.v109-row .v109-chips{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.v109-row .v109-btn{flex:none!important;margin-inline-start:auto!important;white-space:nowrap}
.v109-tag{font-size:.66rem!important;padding:2px 7px!important;line-height:1.4}
`;document.head.appendChild(st)}
const _render=window.render;
window.render=function(){
 _render.apply(this,arguments);
 const main=document.getElementById('main');if(!main)return;
 if(view==='det'||view==='mdet'){
  const btn=[...main.querySelectorAll('button')].find(b=>(b.getAttribute('onclick')||'').indexOf('vehStatusForm(')>=0);
  if(btn){
   const row=btn.parentElement;
   if(row){
    row.classList.add('v109-row');
    const kids=[...row.children].filter(c=>c!==btn);
    let chips=row.querySelector('.v109-chips');
    if(!chips){chips=document.createElement('div');chips.className='v109-chips';row.insertBefore(chips,btn)}
    kids.forEach(k=>{if(k!==chips)chips.appendChild(k)});
    btn.classList.add('v109-btn');
    chips.querySelectorAll('.chip').forEach(c=>c.classList.add('v109-tag'));
   }
  }
 }
};
render();
})();
</script>
