:root{--bg:#eef1f4;--card:#fff;--ink:#0d1620;--muted:#55616d;--line:#cfd6dd;--primary:#0a5c8a;--primary-ink:#fff;--primary-soft:#dcecf6;--staff:#ffd400;--staff-ink:#1a1500;--axis-soft:#eceff1;--err:#c62828;--err-soft:#fdeaea;--warn:#8a5200;--warn-soft:#fff1d6;--ok:#1b7a3d;--ok-soft:#e1f4e6;--top-h:52px;--y:var(--staff);--bad:var(--err);--mut:var(--muted);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1318;--card:#171f27;--ink:#edf2f6;--muted:#9aa8b5;--line:#2c3946;--primary:#4aa8dc;--primary-ink:#04202f;--primary-soft:#14313f;--axis-soft:#1d262e;--err:#ff8a80;--err-soft:#3a1c1c;--warn:#ffc266;--warn-soft:#382a10;--ok:#6fcf76;--ok-soft:#16301a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Vazirmatn","Vazir","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;padding-top:calc(var(--top-h) + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0 0 .5rem;line-height:1.35}h2{font-size:1.1rem}h3{font-size:1rem}p{margin:.25rem 0 .6rem}
small,.mut{color:var(--muted)}.bad{color:var(--err)}.ok{color:var(--ok)}
#top{position:fixed;inset:0 0 auto 0;z-index:30;height:calc(var(--top-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px;background:var(--primary);color:var(--primary-ink)}
#top .title{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .title small{display:block;font-weight:400;opacity:.85;font-size:.72rem;line-height:1.1;color:inherit}

function stForm(id){const t=S.tx.find(x=>x.id==id),n=S.tx.filter(x=>!x.void&&x.settled&&t.settled.batch&&x.settled.batch==t.settled.batch).length;
 modal(`<h3>اصلاح تسویه</h3><label>تاریخ و ساعت تسویه</label><input id="ew" type="datetime-local" value="${esc(t.settled.when)}"><label>توضیح تسویه</label><textarea id="en" rows="2">${esc(t.settled.note)}</textarea>${n>1?`<label>دامنهٔ اصلاح</label><select id="es"><option value="one">فقط این مورد</option><option value="all">کل تسویهٔ گروهی (${fn(n)} مورد)</option></select>`:''}<label>علت اصلاح (الزامی)</label><textarea id="er" rows="2"></textarea><p class="mut">وضعیت قبلی در تاریخچه می‌ماند و در گزارش مغایرت دیده می‌شود.</p><button class="btn" onclick="doSt('${id}','edit')">ذخیره اصلاح</button> <button class="btn d" onclick="doSt('${id}','undo')">لغو تسویه</button> <button class="btn g" onclick="modal()">انصراف</button>`)}
function doSt(id,mode){const r=$('#er').value.trim();if(!r)return toast('علت اصلاح الزامی است',1);const T=clone(S),t0=T.tx.find(x=>x.id==id);if(!t0||t0.void||!t0.settled)return toast('این مورد تسویه‌شده نیست',1);
 const sc=$('#es')?$('#es').value:'one',bt=t0.settled.batch,l=T.tx.filter(x=>!x.void&&x.settled&&(sc=='all'&&bt?x.settled.batch==bt:x.id==id));
 for(const t of l){(t.payLog=t.payLog||[]).push({...t.settled,action:mode=='undo'?'لغو تسویه':'اصلاح تسویه',reason:r,actAt:new Date().toISOString(),actBy:T.settings.user});if(mode=='undo')t.settled=null;else t.settled={...t.settled,when:$('#ew').value||t.settled.when,note:$('#en').value}}
 commit(T);modal();toast(mode=='undo'?'تسویه لغو شد؛ مبلغ دوباره بدهی است':'اصلاح ثبت شد');render()}
const ref=t=>t.type=='tdraw'?t.mref:'c:'+t.card;
const rf=t=>t.tank?((S.tanks.find(k=>k.id==t.tank)||{}).name||''):((S.cards.find(x=>x.id==t.card)||{}).serial||'');
const mget=r=>{const a=String(r).split(':');return(a[0]=='c'?S.cards:S.machines).find(x=>x.id==a[1])||{}},mname=r=>mget(r).name||'',mcode=r=>mget(r).code||'';

function tbal(T,id){const k=T.tanks.find(x=>x.id==id);let s=+k.sys0,q=+k.tank0;for(const t of T.tx){if(t.tank!=id||t.void)continue;if(t.type=='tquota')s+=t.liters;if(t.type=='tfill'){s-=t.liters;q+=t.liters}if(t.type=='tdraw')q-=t.liters;if(t.type=='tsettle'&&t.mode=='burn')s-=t.liters}return{s,k:q}}
function tval(T,id){const k=T.tanks.find(x=>x.id==id);let q=+k.tank0,v=q*(k.p0||0);for(const t of T.tx){if(t.tank!=id||t.void)continue;if(t.type=='tfill'){q+=t.liters;v+=t.amount}if(t.type=='tdraw'){q-=t.liters;v-=t.amount}}return{q,v,avg:q>0?v/q:(k.p0||0)}}
function addTT(o){const T=clone(S),k=T.tanks.find(x=>x.id==o.tank);
 if(!k)return'مخزن انتخاب نشده است';
 if(!(o.liters>=0)||(o.liters==0&&o.type!='tmeas'&&!(o.type=='tsettle'&&o.mode=='carry')))return'مقدار لیتر باید بیشتر از صفر باشد';
 if(!k.active)return'این مخزن غیرفعال است';
 const b=tbal(T,k.id),v=tval(T,k.id);
 if(o.type=='tsettle'){if(T.settings.role!='admin')return'فقط مدیر مجاز به تعیین تکلیف پایان ماه است';if(!(o.note||'').trim())return'علت یا توضیح الزامی است';if(o.mode=='carry')o.liters=b.s;else if(o.liters>b.s)return'مقدار از سهمیه مانده مخزن در مرکز ('+fn(b.s)+' لیتر) بیشتر است'}
 if(o.type=='tfill'){if(o.payer=='person'?!o.payPerson:!o.src)return'پرداخت‌کننده را مشخص کنید';if(o.liters>b.s)return'مقدار شارژ از سهمیه مرکز مخزن ('+fn(b.s)+' لیتر) بیشتر است؛ ابتدا سهمیه ماهانه را شارژ کنید';if(k.cap>0&&b.k+o.liters>k.cap)return'مجموع از ظرفیت مخزن ('+fn(k.cap)+' لیتر) بیشتر می‌شود';o.price=T.settings.price||0;o.amount=Math.round(o.liters*o.price);if(o.payer=='person')o.settled=null}
 if(o.type=='tdraw'){if(!o.mref)return'ماشین را انتخاب کنید';if(o.liters>b.k)return'مقدار برداشت از موجودی مخزن ('+fn(b.k)+' لیتر) بیشتر است';o.price=Math.round(v.avg);o.amount=Math.round(o.liters*v.avg)}
 const t={id:'T'+T.seq++,at:new Date().toISOString(),by:T.settings.user,void:null,bs:b.s,bk:b.k,...o};T.tx.push(t);const a=tbal(T,k.id);t.as=a.s;t.ak=a.k;commit(T);return null}
const ttile=k=>{const b=tbal(S,k.id),pc=k.cap?Math.max(0,Math.min(100,Math.round(b.k/k.cap*100))):0,lo=k.cap?b.k/k.cap<=.15:b.k<=S.settings.low;return`<div class="card tank-card${lo?' low':''}" onclick="go('tdet','${k.id}')" style="cursor:pointer"><div class="row" style="justify-content:space-between"><b>${esc(k.name)}</b><span class="tg">${esc(k.code)}</span></div><small>${esc(k.project)}${k.active?'':'، غیرفعال'}</small>${k.cap?`<div style="background:var(--line);border-radius:4px;height:12px;margin:8px 0"><div style="width:${pc}%;height:100%;background:${lo?'var(--err)':'var(--ok)'};border-radius:4px"></div></div>`:''}<div class="row"><div><small>سهمیه مرکز</small><br><b>${fn(b.s)}</b> ل</div><div><small>موجودی مخزن</small><br><b class="${lo?'bad':''}">${fn(b.k)}</b> ل${k.cap?' از '+fn(k.cap):''}</div></div></div>`};

function tOp(ty,id){const T={tquota:'شارژ ماهانه سهمیه مرکز مخزن',tfill:'شارژ مخزن (انتقال از سهمیه به مخزن)',tdraw:'برداشت از مخزن',tmeas:'اندازه‌گیری فیزیکی مخزن',tsettle:'تعیین تکلیف پایان ماه مخزن'}[ty];

function subT(ty){const o={type:ty,tank:$('#tk').value,liters:N($('#fl').value),when:$('#fw').value||nowL(),receipt:$('#fr').value,note:$('#fnote').value};
 if(ty=='tdraw'){o.mref=$('#tm').value;o.mname=mname(o.mref);o.person=$('#fp').value;o.driver=$('#fd2').value;if(!o.person)return toast('سوخت‌گیرنده را انتخاب کنید',1)}

const UN={h:'ساعت',km:'کیلومتر'},FS={open:'باز',wip:'در حال تعمیر',done:'تمام‌شده'},STL={over:'سرویس گذشته',soon:'نزدیک سررسید',ok:'سالم',unk:'کارکرد نامشخص'},nv=v=>String(v).trim()===''?NaN:N(v);
const unit=r=>S.units[r]||'h',curVal=r=>{const l=S.reads.filter(x=>x.ref==r&&!x.void);return l.length?Math.max(...l.map(x=>x.val)):null},lastRead=r=>S.reads.filter(x=>x.ref==r&&!x.void).sort((a,b)=>a.when.localeCompare(b.when)).pop()||null;
function dayDiff(a,b){return Math.floor((new Date(a.slice(0,10))-new Date(b.slice(0,10)))/864e5)}
function fDown(f){return f.from?Math.max(0,dayDiff(f.to||nowL(),f.from)):0}
function planLast(p){const g=S.svc.filter(x=>!x.void&&x.ref==p.ref&&x.plans.includes(p.id)).sort((a,b)=>a.when.localeCompare(b.when)).pop();return g?{val:g.meter,when:g.when}:{val:p.v0,when:p.w0}}
function planStat(p){const L=planLast(p),u=p.basis=='d'?'روز':UN[unit(p.ref)];let rem=0,know=true;if(p.basis=='d')rem=p.every-dayDiff(nowL(),L.when);else{const c=curVal(p.ref);if(c==null||L.val==null)know=false;else rem=L.val+p.every-c}const wn=p.warn>0?p.warn:Math.max(1,Math.round(p.every*.1));return{st:!know?'unk':rem<0?'over':rem<=wn?'soon':'ok',rem,u,L}}

/* خرابی */
window.mcFault=ref=>{modal('<h3>ثبت خرابی</h3><p><b>'+esc(mname(ref))+'</b></p><label>شرح خرابی</label><input id="mf_s" placeholder="مثلاً نشتی روغن هیدرولیک"><label>وضعیت</label><select id="mf_t"><option value="open">باز</option><option value="wip">در حال تعمیر</option></select><label>تاریخ و ساعت</label><input id="mf_w" type="datetime-local" value="'+nowL()+'"><label>هزینه (ریال، اختیاری)</label><input id="mf_c" inputmode="decimal"><br><br><button class="btn" onclick="mcSubFault(\''+ref+'\')">ثبت خرابی</button> <button class="btn g" onclick="modal()">انصراف</button>')};
window.mcSubFault=ref=>{const s=$('#mf_s').value.trim();if(!s)return toast('شرح خرابی را بنویسید',1);const T=clone(S),w=$('#mf_w').value||nowL(),st2=$('#mf_t').value;T.faults.push({id:'F'+T.seq++,ref,when:w,from:w,to:'',symptom:s,cause:'',part:'',fixer:'',cost:nv($('#mf_c').value)||0,status:st2,meter:null,by:T.settings.user,hist:[{at:new Date().toISOString(),by:T.settings.user,status:st2}],void:null});commit(T);modal();toast('خرابی ثبت شد');render()};
window.mcFaultSt=id=>{const f=S.faults.find(x=>x.id==id);if(!f)return;modal('<h3>وضعیت خرابی</h3><p><b>'+esc(mname(f.ref))+'</b>: '+esc(f.symptom)+'</p><label>وضعیت</label><select id="mf_t"><option value="open"'+(f.status=='open'?' selected':'')+'>باز</option><option value="wip"'+(f.status=='wip'?' selected':'')+'>در حال تعمیر</option><option value="done"'+(f.status=='done'?' selected':'')+'>تمام‌شده</option></select><label>علت یا قطعهٔ عوض‌شده (اختیاری)</label><input id="mf_x" value="'+esc([f.cause,f.part].filter(Boolean).join('، '))+'"><label>هزینهٔ نهایی (ریال)</label><input id="mf_c" inputmode="decimal" value="'+(f.cost||'')+'"><br><br><button class="btn" onclick="mcDoFaultSt(\''+id+'\')">ذخیره</button> <button class="btn g" onclick="modal()">انصراف</button>')};
window.mcDoFaultSt=id=>{const T=clone(S),f=T.faults.find(x=>x.id==id),s=$('#mf_t').value;f.status=s;f.to=s=='done'?(f.to||nowL()):'';f.cause=$('#mf_x').value;f.cost=nv($('#mf_c').value)||0;(f.hist=f.hist||[]).push({at:new Date().toISOString(),by:T.settings.user,status:s});commit(T);modal();toast('ذخیره شد');render()};
/* سوابق */
V.mlog=()=>{const refs=machines().map(x=>x.ref).filter(r=>!ML.m||r==ML.m);let ev=[];refs.forEach(r=>ev.push(...events(r)));ev=ev.filter(x=>!ML.t||x.k==ML.t).sort((a,b)=>String(b.t).localeCompare(String(a.t))).slice(0,150);
 const cost=S.svc.filter(x=>!x.void&&(!ML.m||x.ref==ML.m)).reduce((a,x)=>a+(x.cost||0),0)+S.faults.filter(x=>!x.void&&(!ML.m||x.ref==ML.m)).reduce((a,x)=>a+(x.cost||0),0);
 return '<div class="card"><select onchange="mcLogF(\'m\',this.value)"><option value="">همه ماشین‌ها</option>'+machines().map(x=>'<option value="'+x.ref+'"'+(x.ref==ML.m?' selected':'')+'>'+esc(x.m.name)+'، '+esc(x.m.code||'')+'</option>').join('')+'</select><div class="mc-chips">'+[['','همه'],['chk','بازرسی'],['svc','سرویس و تعویض'],['flt','خرابی']].map(c=>'<button class="mc-chip'+(ML.t==c[0]?' on':'')+'" onclick="mcLogF(\'t\',\''+c[0]+'\')">'+c[1]+'</button>').join('')+'</div><p><b>جمع هزینهٔ سرویس و خرابی: '+rl(cost)+'</b></p>'+(ev.length?ev.map(x=>'<div class="mc-evh"><small style="color:var(--primary);font-weight:600">'+esc(mname(x.ref))+'</small>'+x.h+'</div>').join(''):'<p class="mut">موردی ثبت نشده است.</p>')+'</div>'};
window.mcLogF=(k,v)=>{ML[k]=v;render()};
V.svclog=()=>{ML.t='svc';return V.mlog()};V.faults=()=>{ML.t='flt';return V.mlog()};
/* منو و عنوان‌ها */
const setN=(k,l)=>{const x=NAV.find(y=>y[0]==k);if(x)x[1]=l;else NAV.push([k,l])};
setN('maint','تعمیر و نگهداری');setN('periodic','تعمیر و نگهداری');setN('svclog','سوابق نگهداری');setN('faults','سوابق نگهداری');setN('insp','بازرسی روزانه');setN('mlog','سوابق نگهداری');
IC.mlog=IC.svclog;IC.insp=IC.svclog;
GR.forEach(g=>{if(g[0]=='تعمیر و نگهداری')g[1]=['maint','mlog']});
const _side=window.sideNavHtml;window.sideNavHtml=function(cur){const groups=[['نمای کلی',['dash','rep']],['مدیریت سوخت',['fuel','charge','cards','tank','tdraw']],['ناوگان و نگهداری',['mach','maint','mlog']],['امور مالی و اشخاص',['pers','bank','stm']],['سامانه',['set']]],L=Object.fromEntries(NAV);return groups.map(([t,ks])=>'<div class="side-group"><div class="side-group-title">'+t+'</div>'+ks.map(k=>'<button class="side-link '+(cur==k?'active':'')+'" onclick="go(\''+k+'\')"><svg viewBox="0 0 24 24" aria-hidden="true">'+(IC[k]||'')+'</svg><span>'+L[k]+'</span></button>').join('')+'</div>').join('')};
const _render=window.render;window.render=function(){_render();const D={maint:'وضعیت همهٔ ماشین‌ها: بازرسی، سرویس و خرابی',mdet:'پروندهٔ ماشین: بازرسی، سرویس و خرابی در یک صفحه',insp:'بازرسی امروز؛ فقط موارد نیازمند تعویض را علامت بزنید',mlog:'سابقهٔ بازرسی، سرویس و خرابی همهٔ ماشین‌ها'};const d=D[view]||(view=='periodic'||view=='svclog'||view=='faults'?D.mlog:null);const p=document.querySelector('.module-hero-copy p'),h=document.querySelector('.module-hero-copy h2');if(p&&d)p.textContent=d;if(h&&(view=='mdet'||view=='insp')){const m=mget(norm(arg));if(m&&m.id)h.textContent=(view=='insp'?'بازرسی: ':'')+m.name}};
/* حذف کامل عکس‌ها از اطلاعات قبلی */
try{let ch=false;(S.checks||[]).forEach(c=>(c.items||[]).forEach(i=>{if('photo' in i){delete i.photo;ch=true}}));if(ch)commit(S)}catch(e){}
/* ذخیره‌سازی ناموفق باید دیده شود */
const warn=document.createElement('div');warn.id='storeWarn';warn.textContent='هشدار: اطلاعات در حافظهٔ دستگاه ذخیره نشد (حافظه پر است). همین حالا از «تنظیمات» پشتیبان بگیرید.';document.body.appendChild(warn);
window.commit=function(T){let ok=true;try{localStorage.setItem(K,JSON.stringify(T))}catch(e){ok=false}persist=ok;S=T;warn.style.display=ok?'none':'block'};
render();
})();
</script>
</body></html>
