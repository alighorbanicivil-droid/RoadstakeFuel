<style>

</style></head><body>
<header><div class="br"><b>Road Fuel</b><span>مکمل Road Stake</span></div>
<input id="q" placeholder="جست‌وجو: سریال، ماشین، کد، پلاک، راننده، پروژه" oninput="q=this.value;if(view!='cards')view='cards';render()"></header>
<div class="stripe"></div><nav id="nav"></nav><main id="main"></main><div id="m" onclick="if(event.target==this)modal()"></div><div id="t"></div>
<script>
const K='roadfuel_v3',$=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const N=v=>+D(v).replace(/٫/g,'.').replace(/[,٬]/g,'');
const fn=x=>(+x).toLocaleString('fa-IR'),fd=s=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{dateStyle:'short',timeStyle:'short'}).format(new Date(s));
const nowL=(h=0)=>{const d=new Date(Date.now()-h*36e5);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const mk=w=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit'}).formatToParts(new Date(w)).map(x=>[x.type,x.value]));return p.year+'/'+p.month};
const rl=x=>fn(x)+' ریال';
const TY={alloc:'تخصیص سهمیه',charge:'شارژ ماهانه مرکز',fuel:'سوخت‌گیری',settle:'پایان ماه',tquota:'شارژ سهمیه مخزن',tfill:'شارژ مخزن',tdraw:'برداشت از مخزن',tmeas:'اندازه‌گیری مخزن',tsettle:'پایان ماه مخزن'},TYPES=['بیل مکانیکی','لودر','بلدوزر','گریدر','کامیون','کمپرسی','غلطک','سایر'];
const ROLES=['راننده','اپراتور ماشین‌آلات','مسئول سوخت','مسئول کارگاه','مدیر'];
const LB={serial:'سریال',code:'کد',name:'نام',type:'نوع',plate:'پلاک',driver:'راننده',project:'پروژه',cap:'سقف سوخت‌گیری',note:'توضیحات'};
let S=null,view='dash',arg=null,q='',persist=true,F={},lastRep=null,tt;
let R={t:'fuel',from:nowL(720).slice(0,10),to:nowL().slice(0,10),m:''};
try{S=JSON.parse(localStorage.getItem(K))}catch(e){persist=false}
function commit(T){try{localStorage.setItem(K,JSON.stringify(T))}catch(e){persist=false}S=T}
function toast(m,b){const e=$('#t');e.textContent=m;e.className=b?'bad on':'on';clearTimeout(tt);tt=setTimeout(()=>e.className='',3800)}
function modal(h){$('#m').innerHTML=h?'<div class="box">'+h+'</div>':'';$('#m').style.display=h?'flex':'none'}
function bal(T,id){const c=T.cards.find(x=>x.id==id);let s=+c.sys0,k=+c.card0;for(const t of T.tx){if(t.card!=id||t.void)continue;if(t.type=='alloc'||t.type=='charge')s+=t.liters;if(t.type=='settle'&&t.mode=='burn')s-=t.liters;if(t.type=='fuel'){s-=t.tr;k+=t.tr-t.liters}}return{s,k}}
function addTx(o){if(o.tank)return addTT(o);const T=clone(S),c=T.cards.find(x=>x.id==o.card);
 if(!c)return'کارت انتخاب نشده است';
 if(!(o.liters>0)&&!(o.type=='settle'&&o.mode=='carry'))return'مقدار لیتر باید بیشتر از صفر باشد';
 if(!c.active)return'این کارت غیرفعال است';
 if(o.type=='settle'&&T.settings.role!='admin')return'فقط مدیر مجاز به تعیین تکلیف پایان ماه است';
 const b=bal(T,c.id);
 if(o.type=='fuel'){if(o.payer=='person'?!o.payPerson:!o.src)return'پرداخت‌کننده را مشخص کنید';o.price=T.settings.price||0;o.amount=Math.round(o.liters*o.price);if(o.payer=='person')o.settled=null;if(o.liters>b.k)return'مقدار سوخت‌گیری از سهمیه قابل تحویل ('+fn(b.k)+' لیتر) بیشتر است';if(c.cap>0&&o.liters>c.cap)return'مقدار از سقف سوخت‌گیری این خودرو ('+fn(c.cap)+' لیتر) بیشتر است';o.tr=Math.min(o.liters,b.s)}
 if(o.type=='settle'){if(o.mode=='carry')o.liters=b.s;else if(o.liters>b.s)return'مقدار بیشتر از سهمیه مانده در مرکز است'}
 const t={id:'T'+T.seq++,at:new Date().toISOString(),by:T.settings.user,void:null,bs:b.s,bk:b.k,...o};
 T.tx.push(t);const a=bal(T,c.id);t.as=a.s;t.ak=a.k;commit(T);return null}
function voidTx(id,r){if(!r.trim())return'علت ابطال الزامی است';const T=clone(S),t=T.tx.find(x=>x.id==id);
 if(!t||t.void)return'عملیات پیدا نشد یا قبلاً باطل شده است';
 t.void={reason:r.trim(),by:T.settings.user,at:new Date().toISOString()};
 for(const c of T.cards){const b=bal(T,c.id);if(b.s<0||b.k<0)return'ابطال این عملیات باعث منفی شدن موجودی می‌شود'}for(const k of T.tanks){const b=tbal(T,k.id);if(b.s<0||b.k<0)return'ابطال این عملیات باعث منفی شدن موجودی مخزن می‌شود'}
 commit(T);return null}
function saveCard(id,v){const T=clone(S),sr=v.serial.trim();
 if(!sr||!v.name.trim())return'شماره سریال و نام ماشین‌آلات الزامی است';
 if(T.cards.some(c=>c.serial==sr&&c.id!=id))return'کارتی با این شماره سریال قبلاً ثبت شده است';
 v.serial=sr;
 if(id){const c=T.cards.find(x=>x.id==id),ch=[];for(const k in LB)if((c[k]||'')!=v[k])ch.push(LB[k]+': «'+(c[k]||'')+'» به «'+v[k]+'»');
  if(!ch.length)return'تغییری وجود ندارد';Object.assign(c,v);T.edits.push({card:id,at:new Date().toISOString(),by:T.settings.user,changes:ch.join('، ')})}
 else{if(v.sys0<0||v.card0<0)return'مقادیر اولیه نمی‌تواند منفی باشد';T.cards.push({id:'C'+T.seq++,active:true,date:new Date().toISOString(),...v})}
 commit(T);return null}
function blank(keep){return{tanks:[],machines:[],cards:[],persons:[],tx:[],edits:[],seq:10,settings:keep||{user:'مدیر سیستم',role:'admin',low:100,price:0,prices:[],sources:[{name:'بودجه پروژه',active:true},{name:'دفتر مرکزی',active:true},{name:'پیمانکار',active:true}]}}}
if(!S||!S.cards)commit(blank());
S.tanks=S.tanks||[];S.machines=S.machines||[];
S.settings.sources=S.settings.sources||[{name:'بودجه پروژه',active:true},{name:'دفتر مرکزی',active:true},{name:'پیمانکار',active:true}];S.settings.prices=S.settings.prices||[];if(S.settings.price==null)S.settings.price=30000;
const opts=(a,sel,f)=>a.map(x=>{const v=x.id??x;return`<option value="${esc(v)}"${v==sel?' selected':''}>${esc(f?f(x):x)}</option>`}).join('');
const match=c=>!q||D([c.serial,c.name,c.code,c.plate,c.driver,c.project].join(' ')).includes(D(q));
const st=(l,v)=>`<div class="card"><small>${l}</small><b>${v}</b></div>`;
const tile=c=>{const b=bal(S,c.id),lo=c.active&&b.s+b.k<=S.settings.low;return`<div class="card${lo?' low':''}" onclick="go('det','${c.id}')" style="cursor:pointer"><div class="row" style="justify-content:space-between"><b>${esc(c.name)}</b><span class="tg">${esc(c.serial)}</span></div><small>${esc(c.code)}، ${esc(c.driver)}، ${esc(c.project)}${c.active?'':'، غیرفعال'}</small><div class="row" style="margin-top:6px"><div><small>سهمیه مرکز</small><br><b>${fn(b.s)}</b> ل</div><div><small>سهمیه قابل تحویل</small><br><b class="${lo?'bad':''}">${fn(b.k)}</b> ل</div></div></div>`};
const txT=l=>`<div class="sc"><table><tr><th>زمان<th>نوع<th>کارت<th>لیتر<th>مبلغ (ریال)<th>پرداخت‌کننده<th>شخص<th>ثبت‌کننده<th>قابل تحویل بعد<th></tr>${l.map(t=>{const c=S.cards.find(x=>x.id==t.card)||{},py=!(t.type=='fuel'||t.type=='tfill')?'':t.payer=='person'?'شخص: '+esc(t.payPerson)+(t.settled?' (تسویه‌شده)':' (تسویه‌نشده)'):esc(t.src);return`<tr class="${t.void?'vd':''}"><td>${fd(t.when)}<td>${TY[t.type]}${t.mname?'، '+esc(t.mname):''}<td>${esc(rf(t))}<td>${fn(t.liters)}<td>${t.amount!=null?fn(t.amount):''}<td>${py}<td>${esc(t.person)}<td>${esc(t.by)}<td>${fn(t.ak)}<td>${t.void?'باطل: '+esc(t.void.reason):`<a onclick="voidForm('${t.id}')">ابطال</a>${t.payer=='person'&&!t.settled?` <a style="color:var(--ok)" onclick="payForm('${t.id}')">تسویه</a>`:''}${t.payer=='person'&&t.settled?` <a style="color:var(--ok)" onclick="stForm('${t.id}')">اصلاح تسویه</a>`:''}`}`}).join('')}</table></div>`;
const NAV=[['dash','داشبورد'],['cards','کارت‌های گازوئیل'],['mach','ماشین‌آلات'],['tank','مخازن'],['tdraw','برداشت از مخزن'],['fuel','ثبت سوخت‌گیری'],['charge','شارژ ماهانه'],['pers','اشخاص'],['stm','صورتحساب اشخاص'],['rep','گزارش‌ها'],['set','تنظیمات']];
function go(v,a){view=v;arg=a||null;render();scrollTo(0,0)}
function render(){$('#nav').innerHTML=NAV.map(([k,l])=>`<button class="${view==k||(view=='det'&&k=='cards')||(view=='tdet'&&k=='tank')?'on':''}" onclick="go('${k}')">${l}</button>`).join('');$('#main').innerHTML=V[view]();if($('#fc'))info()}
function info(){const c=S.cards.find(x=>x.id==$('#fc').value),b=c&&bal(S,c.id),L=N($('#fl').value),p=S.settings.price;$('#inf').innerHTML=c?`<div class="card">سریال: <b dir="ltr">${esc(c.serial)}</b>، ${esc(c.name)}<br>سهمیه مرکز: <b>${fn(b.s)}</b> ل، قابل تحویل: <b>${fn(b.k)}</b> ل${c.cap?'، سقف: <b>'+fn(c.cap)+'</b> ل':''}${L>0?`<br>${$('#py')?'مبلغ':'ارزش سهمیه'}: <b>${rl(Math.round(L*p))}</b> (قیمت هر لیتر ${rl(p)})`:''}</div>`:'';$('#fj').textContent=fd($('#fw').value||nowL())}
const srcSel=()=>`<label>منبع پرداخت</label><select id="ps">${opts(S.settings.sources.filter(x=>x.active).map(x=>x.name),'')}</select>`;
function pyc(){$('#pyc').innerHTML=$('#py').value=='person'?`<label>شخص پرداخت‌کننده</label><select id="pp">${pOpts()}</select>`:srcSel()}
const pOpts=()=>'<option value="">انتخاب کنید…</option>'+opts(S.persons.filter(p=>p.active).map(p=>p.name),'');
function ff(ty){const f=ty=='fuel',cs=S.cards.filter(c=>c.active);return`<div class="card"><h2>${f?'ثبت سوخت‌گیری':'شارژ ماهانه سهمیه مرکز'}</h2><label>کارت گازوئیل</label><select id="fc" onchange="info()"><option value="">انتخاب کنید…</option>${opts(cs,arg,c=>c.serial+'، '+c.name)}</select><div id="inf"></div>
${f?`<label>نام سوخت‌گیرنده</label><select id="fp">${pOpts()}</select><label>راننده یا اپراتور (در صورت تفاوت)</label><input id="fd2"><label>پرداخت‌کننده هزینه</label><select id="py" onchange="pyc()"><option value="company">شرکت</option><option value="person">شخص</option></select><div id="pyc">${srcSel()}</div>`:''}
<label>مقدار (لیتر)</label><input id="fl" inputmode="decimal" oninput="info()"><label>تاریخ و ساعت (پیش‌فرض: اکنون)</label><input id="fw" type="datetime-local" value="${nowL()}" onchange="info()"><small id="fj"></small>
${f?'<label>محل سوخت‌گیری یا جایگاه</label><input id="fx">':''}<label>شماره رسید یا کد پیگیری</label><input id="fr"><label>توضیحات</label><textarea id="fnote" rows="2"></textarea><br><br><button class="btn" style="width:100%" onclick="subTx('${ty}')">ثبت</button></div>`}
function subTx(ty,force){const f=ty=='fuel',o={type:ty,card:$('#fc').value,liters:N($('#fl').value),when:$('#fw').value||nowL(),receipt:$('#fr').value,note:$('#fnote').value};
 if(f){o.person=$('#fp').value;o.driver=$('#fd2').value;o.place=$('#fx').value;o.payer=$('#py').value;if(o.payer=='person')o.payPerson=$('#pp').value;else o.src=$('#ps').value;if(!o.person)return toast('سوخت‌گیرنده را انتخاب کنید',1)}
 if(!force){const w=[],m=f?0:S.tx.filter(t=>t.type=='charge'&&!t.void&&t.card==o.card&&mk(t.when)==mk(o.when)).length;if(m>=2)w.push('این شارژ شمارهٔ '+fn(m+1)+' این کارت در همین ماه است');if(o.receipt&&S.tx.some(t=>!t.void&&t.receipt==o.receipt))w.push('این شماره رسید قبلاً ثبت شده است');if(w.length)return modal('<h3>مطمئن هستید؟</h3><p>'+w.join('<br>')+'</p><button class="btn" onclick="modal();subTx(\''+ty+'\',1)">بله، ثبت شود</button> <button class="btn g" onclick="modal()">انصراف</button>')}
 const e=addTx(o);if(e)return toast(e,1);const b=bal(S,o.card);toast('ثبت شد. سهمیه مرکز: '+fn(b.s)+'، قابل تحویل: '+fn(b.k)+' لیتر');go('det',o.card)}
function payForm(id){modal(`<h3>تسویه پرداخت شخصی</h3><label>تاریخ و ساعت تسویه</label><input id="yw" type="datetime-local" value="${nowL()}"><label>توضیح (مثلاً شماره پرداخت)</label><textarea id="yn" rows="2"></textarea><br><br><button class="btn" onclick="doPay('${id}')">ثبت تسویه</button> <button class="btn g" onclick="modal()">انصراف</button>`)}
function doPay(id){const T=clone(S),t=T.tx.find(x=>x.id==id);if(!t||t.void||t.payer!='person'||t.settled)return toast('این عملیات قابل تسویه نیست',1);t.settled={when:$('#yw').value||nowL(),at:new Date().toISOString(),by:T.settings.user,note:$('#yn').value};commit(T);modal();toast('تسویه ثبت شد');render()}
function togSrc(i){const T=clone(S);T.settings.sources[i].active=!T.settings.sources[i].active;commit(T);render()}
function addSrc(){const n=$('#sn2').value.trim();if(!n)return;if(S.settings.sources.some(x=>x.name==n))return toast('این منبع قبلاً ثبت شده است',1);const T=clone(S);T.settings.sources.push({name:n,active:true});commit(T);render()}

function doSt(id,mode){const r=$('#er').value.trim();if(!r)return toast('علت اصلاح الزامی است',1);const T=clone(S),t0=T.tx.find(x=>x.id==id);if(!t0||t0.void||!t0.settled)return toast('این مورد تسویه‌شده نیست',1);

function tankForm(id){const e=!!id,k=e?S.tanks.find(x=>x.id==id):{sys0:0,tank0:0,cap:0};modal(`<h3>${e?'ویرایش مخزن':'مخزن جدید'}</h3>`+[['name','نام مخزن'],['code','کد مخزن'],['project','پروژه یا کارگاه'],['cap','ظرفیت (لیتر)']].map(([f,l])=>`<label>${l}</label><input id="tf_${f}" value="${esc(k[f])}">`).join('')+`<label>سهمیه اولیه مرکز (ل)</label><input id="tf_sys0" inputmode="decimal" value="${k.sys0}"${e?' disabled':''}><label>موجودی اولیه مخزن (ل)</label><input id="tf_tank0" inputmode="decimal" value="${k.tank0}"${e?' disabled':''}><label>توضیحات</label><textarea id="tf_note" rows="2">${esc(k.note)}</textarea><br><br><button class="btn" onclick="doTank('${id||''}')">ذخیره</button> <button class="btn g" onclick="modal()">انصراف</button>`)}
function doTank(id){const T=clone(S),v={name:$('#tf_name').value.trim(),code:$('#tf_code').value,project:$('#tf_project').value,cap:N($('#tf_cap').value)||0,note:$('#tf_note').value};
 if(!v.name)return toast('نام مخزن الزامی است',1);if(T.tanks.some(k=>k.name==v.name&&k.id!=id))return toast('مخزنی با این نام قبلاً ثبت شده است',1);
 if(id){const k=T.tanks.find(x=>x.id==id),ch=[];for(const f in v)if((k[f]||'')!=v[f])ch.push(f+': «'+(k[f]||'')+'» به «'+v[f]+'»');if(!ch.length)return toast('تغییری وجود ندارد',1);Object.assign(k,v);T.edits.push({card:id,at:new Date().toISOString(),by:T.settings.user,changes:'مخزن، '+ch.join('، ')})}
 else{const s0=N($('#tf_sys0').value),t0=N($('#tf_tank0').value);if(s0<0||t0<0)return toast('مقادیر اولیه نمی‌تواند منفی باشد',1);T.tanks.push({id:'K'+T.seq++,active:true,date:new Date().toISOString(),sys0:s0,tank0:t0,p0:T.settings.price||0,...v})}
 commit(T);modal();toast('ذخیره شد');render()}
function togTank(id){const T=clone(S),k=T.tanks.find(x=>x.id==id);k.active=!k.active;T.edits.push({card:id,at:new Date().toISOString(),by:T.settings.user,changes:'مخزن، '+(k.active?'فعال شد':'غیرفعال شد')});commit(T);render()}
function machForm(id){const m=id?S.machines.find(x=>x.id==id):{type:TYPES[0]};modal(`<h3>${id?'ویرایش ماشین':'ماشین بدون کارت (فقط از مخزن)'}</h3>`+[['name','نام ماشین‌آلات'],['code','کد ماشین‌آلات'],['plate','پلاک'],['driver','راننده یا اپراتور اصلی'],['project','پروژه یا کارگاه']].map(([f,l])=>`<label>${l}</label><input id="mf_${f}" value="${esc(m[f])}">`).join('')+`<label>نوع</label><select id="mf_type">${opts(TYPES,m.type)}</select><br><br><button class="btn" onclick="doMach('${id||''}')">ذخیره</button> <button class="btn g" onclick="modal()">انصراف</button>${e?`<button class="btn d" onclick="delForm('mach','${id}')">حذف</button>`:''}`)}
function doMach(id){const T=clone(S),v={};for(const f of['name','code','plate','driver','project','type'])v[f]=$('#mf_'+f).value;if(!v.name.trim())return toast('نام الزامی است',1);
 if(id){const m=T.machines.find(x=>x.id==id),ch=[];for(const f in v)if((m[f]||'')!=v[f])ch.push(f+': «'+(m[f]||'')+'» به «'+v[f]+'»');if(!ch.length)return toast('تغییری وجود ندارد',1);Object.assign(m,v);T.edits.push({card:id,at:new Date().toISOString(),by:T.settings.user,changes:'ماشین، '+ch.join('، ')})}else T.machines.push({id:'M'+T.seq++,active:true,note:'',...v});commit(T);modal();toast('ذخیره شد');render()}
V.tank=()=>`<button class="btn" onclick="tankForm()">+ مخزن جدید</button><br><br>`+(S.tanks.map(ttile).join('')||'<p>مخزنی ثبت نشده است.</p>');
V.tdraw=()=>`<button class="btn" style="width:100%" onclick="tOp('tdraw','')">+ ثبت برداشت از مخزن</button><h3>آخرین برداشت‌ها</h3><div class="card">${S.tx.filter(t=>t.type=='tdraw').length?txT(S.tx.filter(t=>t.type=='tdraw').slice(-15).reverse()):'برداشتی ثبت نشده است.'}</div>`;
V.tdet=()=>{const k=S.tanks.find(x=>x.id==arg);if(!k)return'';const b=tbal(S,k.id),v=tval(S,k.id),all=S.tx.filter(t=>t.tank==k.id).sort((a,b)=>b.when.localeCompare(a.when)),m=all.find(t=>t.type=='tmeas'&&!t.void),ok=ty=>all.filter(t=>!t.void&&t.type==ty).reduce((s,t)=>s+t.liters,0),ed=S.edits.filter(e=>e.card==k.id);
 return`<div class="card"><h2>${esc(k.name)} <span class="tg">${esc(k.code)}</span></h2><small>${esc(k.project)}${k.cap?'، ظرفیت '+fn(k.cap)+' ل':''}${k.active?'':'<br><b class="bad">غیرفعال</b>'}</small></div><div class="grid">${st('سهمیه مانده در مرکز',fn(b.s)+' ل')}${st('موجودی مخزن',fn(b.k)+' ل')}${st('میانگین قیمت موجودی',rl(Math.round(v.avg)))}${st('ارزش موجودی',rl(Math.round(v.v)))}${st('مجموع شارژها',fn(ok('tfill'))+' ل')}${st('مجموع برداشت‌ها',fn(ok('tdraw'))+' ل')}${m?st('اندازه‌گیری آخر',fn(m.liters)+' ل، مغایرت '+fn(m.liters-m.ak)+' ل'):''}</div><div class="row"><button class="btn" onclick="tOp('tdraw','${k.id}')">برداشت</button><button class="btn" onclick="tOp('tfill','${k.id}')">شارژ مخزن</button><button class="btn g" onclick="tOp('tquota','${k.id}')">شارژ سهمیه ماهانه</button><button class="btn g" onclick="tOp('tmeas','${k.id}')">اندازه‌گیری</button>${S.settings.role=='admin'?`<button class="btn g" onclick="tOp('tsettle','${k.id}')">پایان ماه</button>`:''}<button class="btn g" onclick="tankForm('${k.id}')">ویرایش</button><button class="btn g" onclick="togTank('${k.id}')">${k.active?'غیرفعال‌سازی':'فعال‌سازی'}</button><button class="btn d" onclick="delForm('tank','${k.id}')">حذف</button></div><h3>تاریخچه</h3><div class="card">${all.length?txT(all):'<p>عملیاتی ثبت نشده است.</p>'}</div>`+(ed.length?'<h3>تاریخچه تغییرات</h3><div class="card">'+ed.map(e=>`<p>${fd(e.at)}، ${esc(e.by)}: ${esc(e.changes)}</p>`).join('')+'</div>':'')};
{const m0=V.mach;V.mach=()=>`<button class="btn" onclick="machForm()">+ ماشین بدون کارت</button><br><br>`+m0()+(S.machines.length?`<div class="card"><h3>ماشین‌های مخزنی (بدون کارت)</h3><div class="sc"><table><tr><th>ماشین<th>کد<th>نوع<th>راننده<th>پروژه<th>وضعیت<th></tr>${S.machines.filter(m=>match(m)).map(m=>`<tr><td>${esc(m.name)}<td>${esc(m.code)}<td>${esc(m.type)}<td>${esc(m.driver)}<td>${esc(m.project)}<td>${m.active?'فعال':'غیرفعال'}<td><a style="color:var(--ink)" onclick="machForm('${m.id}')">ویرایش</a>`).join('')}</table></div></div>`:'')}

const DK={card:'کارت',pers:'شخص',tank:'مخزن',mach:'ماشین'};
function dinfo(kind,id){const L={card:S.cards,pers:S.persons,tank:S.tanks,mach:S.machines}[kind],x=L.find(y=>y.id==id);if(!x)return null;const nm=kind=='card'?x.serial+'، '+x.name:kind=='mach'?x.name+' ('+x.code+')':x.name;let n;if(kind=='card')n=S.tx.filter(t=>t.card==id||t.mref=='c:'+id).length;else if(kind=='tank')n=S.tx.filter(t=>t.tank==id).length;else if(kind=='mach')n=S.tx.filter(t=>t.mref=='m:'+id).length;else n=S.tx.filter(t=>t.person==x.name||t.payPerson==x.name||t.driver==x.name).length;return{nm,n}}
function delForm(kind,id){const d=dinfo(kind,id);if(!d)return;if(d.n)return modal(`<h3>حذف ${DK[kind]} ممکن نیست</h3><p><b>${esc(d.nm)}</b> در ${fn(d.n)} عملیات ثبت‌شده استفاده شده و برای حفظ سابقه قابل حذف نیست. به‌جای حذف می‌توانید آن را غیرفعال کنید.</p><button class="btn g" onclick="modal()">بستن</button>`);
 modal(`<h3>حذف ${DK[kind]}</h3><p>${DK[kind]} <b>${esc(d.nm)}</b> حذف می‌شود. این کار فقط برای ثبت اشتباه است و برگشت‌پذیر نیست.</p><label>علت حذف (الزامی)</label><textarea id="dr" rows="2"></textarea><br><br><button class="btn d" onclick="doDel('${kind}','${id}')">حذف</button> <button class="btn g" onclick="modal()">انصراف</button>`)}
function doDel(kind,id){const r=$('#dr').value.trim();if(!r)return toast('علت حذف الزامی است',1);const d=dinfo(kind,id);if(!d||d.n)return toast('این مورد قابل حذف نیست',1);const T=clone(S),K={card:'cards',pers:'persons',tank:'tanks',mach:'machines'}[kind];T[K]=T[K].filter(x=>x.id!=id);if(kind=='card')T.edits=T.edits.filter(e=>e.card!=id);(T.deletions=T.deletions||[]).push({kind:DK[kind],name:d.nm,reason:r,at:new Date().toISOString(),by:T.settings.user});commit(T);modal();toast('حذف شد');go({card:'cards',pers:'pers',tank:'tank',mach:'mach'}[kind])}

render();
</script>
